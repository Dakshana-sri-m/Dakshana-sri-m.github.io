    const PortfolioProvider = ({ children }) => {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);

        } catch (e) {
          console.warn('Failed to parse saved data', e);
        }
        return INITIAL_DATA;
      });

      const [isEditMode, setIsEditMode] = useState(false);

      const [saveStatus, setSaveStatus] = useState('Saved');

          return () => clearTimeout(timer);

          console.error('Error saving', e);
        }
      }, [data]);

      const updateProfile = (profile) => setData(p => ({ ...p, profile: { ...p.profile, ...profile } }));
      const updateAbout = (about) => setData(p => ({ ...p, about: { ...p.about, ...about } }));
      const updatePersonalInfluence = (influence) => setData(p => ({ ...p, personalInfluence: { ...p.personalInfluence, ...influence } }));
      
      const addCertificate = (cert) => setData(p => ({ ...p, certificates: [cert, ...p.certificates] }));
      const updateCertificate = (id, cert) => setData(p => ({
        ...p,
        certificates: p.certificates.map(c => c.id === id ? { ...c, ...cert } : c)
      }));
      const deleteCertificate = (id) => setData(p => ({
        ...p,
        certificates: p.certificates.filter(c => c.id !== id)
      }));

      const addProtoSemWeek = (week) => setData(p => ({
        ...p,
        protosem: { ...p.protosem, weeks: [...p.protosem.weeks, week] }
      }));

      const addDayReflection = (weekNum, dayNum, prompt, answer) => {
        setData(p => ({
          ...p,
          protosem: {
            ...p.protosem,
            weeks: p.protosem.weeks.map(w => {
              if (w.weekNumber === weekNum) {
                return {
                  ...w,
                  days: w.days.map(d => {
                    if (d.dayNumber === dayNum) {
                      return {
                        ...d,
                        reflections: [...(d.reflections || []), { prompt, answer }]
                      };
                    }
                    return d;
                  })
                };
              }
              return w;
            })
          }
        }));
      };

      const addBuildIdea = (idea) => setData(p => ({ ...p, builds: [idea, ...p.builds] }));
      const updateBuildIdea = (id, idea) => setData(p => ({

    const LightShader = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);
        let mouseX = width * 0.5;
        let mouseY = height * 0.3;
        let targetX = mouseX;
        let targetY = mouseY;
        let scrollY = window.scrollY;

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
        };

        const handleScroll = () => {
          scrollY = window.scrollY;
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        window.addEventListener('scroll', handleScroll, { passive: true });

        let time = 0;

        const render = () => {
          mouseX += (targetX - mouseX) * 0.03;
          mouseY += (targetY - mouseY) * 0.03;
          time += 0.003;

          ctx.clearRect(0, 0, width, height);

          // Warm ambient background
          const bgGrad = ctx.createLinearGradient(0, 0, width, height);
          bgGrad.addColorStop(0, '#FAF8F5');
          bgGrad.addColorStop(0.5, '#F4F1EA');
          bgGrad.addColorStop(1, '#EFECE3');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // Subtle sunbeam across paper
          const x1 = width * 0.35 + Math.sin(time * 0.8) * 120 + (mouseX - width * 0.5) * 0.08;
          const y1 = height * 0.3 + Math.cos(time * 0.6) * 90 - (scrollY * 0.04) % height;
          const radius1 = Math.max(width, height) * 0.55;

          const grad1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, radius1);
          grad1.addColorStop(0, 'rgba(255, 253, 245, 0.6)');
          grad1.addColorStop(0.4, 'rgba(247, 243, 232, 0.3)');
          grad1.addColorStop(1, 'rgba(244, 241, 234, 0)');
          ctx.fillStyle = grad1;
          ctx.beginPath();
          ctx.arc(x1, y1, radius1, 0, Math.PI * 2);
          ctx.fill();

          // Soft teal refraction
          const x2 = width * 0.75 + Math.cos(time * 0.7) * 140;
          const y2 = height * 0.65 + Math.sin(time * 0.9) * 100 - (scrollY * 0.03) % height;
          const radius2 = Math.max(width, height) * 0.45;

          const grad2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, radius2);
          grad2.addColorStop(0, 'rgba(224, 237, 232, 0.25)');
          grad2.addColorStop(0.5, 'rgba(235, 242, 238, 0.1)');
          grad2.addColorStop(1, 'rgba(244, 241, 234, 0)');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(x2, y2, radius2, 0, Math.PI * 2);
          ctx.fill();

          // Fine paper grain line effect
          ctx.fillStyle = 'rgba(20, 20, 20, 0.012)';
          for (let y = 0; y < height; y += 24) {
            ctx.fillRect(0, y, width, 1);
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('scroll', handleScroll);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          aria-hidden="true"
          className="fixed inset-0 pointer-events-none -z-10 transition-opacity duration-1000"

                      {errors.subject && <span className="text-[10px] text-red-600 font-mono mt-1 block">{errors.subject}</span>}
                    </div>
                    <div>
                      <label className="block text-[11px] font-mono uppercase text-[#6B6964] mb-1.5 font-semibold">Message *</label>
                      <textarea rows={5} value={form.message} onChange={e => setForm({ ...form, message: e.target.value })} placeholder="Share your thoughts..." className="w-full p-3 bg-white border rounded text-xs font-sans focus:outline-none focus:ring-1 focus:ring-[#1D4D43]" />
                      {errors.message && <span className="text-[10px] text-red-600 font-mono mt-1 block">{errors.message}</span>}
                    </div>
                    <button type="submit" className="w-full py-3.5 bg-[#151515] text-[#FAF8F5] text-xs font-mono tracking-widest uppercase hover:bg-[#1D4D43] transition-colors rounded-sm font-semibold">
                      TRANSMIT MESSAGE →
                    </button>
                  </form>
                )}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ==========================================
    // FOOTER COMPONENT
    // ==========================================
    const Footer = () => {
      const year = new Date().getFullYear();
      return (
        <footer className="py-12 border-t border-[#141414]/15 bg-[#FAF8F5]/90 text-center font-sans">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-3">
            <div className="font-serif text-lg sm:text-xl font-bold tracking-tight text-[#151515]">DAKSHANA SRI M</div>
            <div className="font-mono text-xs text-[#1D4D43] uppercase tracking-widest font-semibold">STUDENT → BUILDER → LEADER</div>
            <p className="font-serif italic text-xs sm:text-sm text-[#6B6964]">"Still building."</p>
            <div className="pt-6 border-t border-[#141414]/10 flex flex-col sm:flex-row items-center justify-between text-[11px] font-mono text-[#8C8880] max-w-2xl mx-auto">
              <span>COIMBATORE, TAMIL NADU · INDIA</span>
              <span>© {year} DAKSHANA SRI M. LIVING ARCHIVE.</span>
            </div>
          </div>
        </footer>
      );
    };

    // ==========================================
    // ROOT APP
    // ==========================================
    const App = () => {
      return (
        <PortfolioProvider>
          <div className="relative min-h-screen bg-[#F4F1EA] text-[#151515] selection:bg-[#1D4D43] selection:text-white font-sans antialiased overflow-x-hidden">
            <LightShader />
            <Navigation />
            <main className="relative z-10">
              <Hero />
              <About />
              <CertificateSection />
              <ProtoSemSection />
              <SkillSection />
              <ProjectSection />
              <BuildSection />
              <AchievementSection />
              <ContactSection />
            </main>
            <Footer />
          </div>
        </PortfolioProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
