  <!-- Sunlight Shader Script -->
  <script>
      (function initSunlightShader() {
        const canvas = document.getElementById('light-shader-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouse = { x: 0.5, y: 0.3, targetX: 0.5, targetY: 0.3 };
        let time = 0;

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
          mouse.targetX = e.clientX / width;
          mouse.targetY = e.clientY / height;
        });

        function render() {
          time += 0.003;
          mouse.x += (mouse.targetX - mouse.x) * 0.03;
          mouse.y += (mouse.targetY - mouse.y) * 0.03;

          ctx.clearRect(0, 0, width, height);

          const x1 = (mouse.x * 0.3 + 0.35 + Math.sin(time * 0.7) * 0.15) * width;
          const y1 = (mouse.y * 0.3 + 0.25 + Math.cos(time * 0.5) * 0.12) * height;
          const grad1 = ctx.createRadialGradient(x1, y1, 10, x1, y1, width * 0.55);
          grad1.addColorStop(0, 'rgba(255, 248, 220, 0.35)');
          grad1.addColorStop(0.5, 'rgba(250, 240, 215, 0.12)');
          grad1.addColorStop(1, 'rgba(244, 241, 234, 0)');
          ctx.fillStyle = grad1;
          ctx.fillRect(0, 0, width, height);

          const x2 = (0.7 - mouse.x * 0.2 + Math.cos(time * 0.4) * 0.1) * width;
          const y2 = (0.6 - mouse.y * 0.2 + Math.sin(time * 0.6) * 0.1) * height;
          const grad2 = ctx.createRadialGradient(x2, y2, 20, x2, y2, width * 0.45);
          grad2.addColorStop(0, 'rgba(27, 77, 62, 0.045)');
          grad2.addColorStop(0.6, 'rgba(27, 77, 62, 0.015)');
          grad2.addColorStop(1, 'rgba(244, 241, 234, 0)');
          ctx.fillStyle = grad2;
          ctx.fillRect(0, 0, width, height);

          requestAnimationFrame(render);
        }
        render();
      })();
  </script>

              content: `What happens when you bring students from Arts, Engineering, Computer Science, and distinct academic backgrounds into a single room and ask them to build together?

On Monday morning, the answer was hesitation, quiet side-conversations, and an unspoken question: *How are we going to work across completely different ways of thinking?*

By Friday afternoon, the room looked completely different. We were no longer isolated individuals defending our discipline’s way of doing things—we were a connected, agile team. Here is the story of our first five days at Protosem, how we navigated the transition from strangers to collaborators, and the lessons that reshaped our perspective along the way.

---

## The Journey: Day by Day

### Day 1: Breaking Barriers & Seeing Problems
*Theme: Connect & Observe*

We kicked off Week 1 with 360° self-introductions and a high-energy Rock–Paper–Scissors networking challenge. While it started as a lighthearted icebreaker, it accomplished something crucial: it broke down the invisible walls we usually keep up in academic settings and pushed us out of our comfort zones.

Once the hesitation melted, we tackled our first major exercise: identifying real-world problems from our lived experiences that society often overlooks.

> **Key Takeaway:** Connection and keen observation are the true starting points of meaningful problem-solving. You can’t solve a problem you haven’t genuinely listened to.

---

### Day 2: Understanding Ourselves Through Stories
*Theme: Discover & Reflect*

Day 2 moved inward. We started by exploring the 16 Personalities framework, identifying our cognitive styles—from Protagonists and Advocates to Commanders and Analysts.

Next, we explored Gen Z web stories and comics, each selecting and presenting a narrative that resonated with our personal or academic journeys. Listening to everyone explain why a particular story struck a chord with them revealed something profound: diversity isn’t just about different college majors or resumes; it’s about the unique lenses through which people perceive, feel, and interpret the world.

> **Key Takeaway:** Embracing cognitive diversity means recognizing that disagreements aren’t roadblocks—they are different perspectives looking at the same reality.

---

### Day 3: Becoming a Team & Hands-on Prototyping
*Theme: Collaborate & Build*

Midweek brought the formation of our official Beta Teams. To break any lingering awkwardness, an Among Us-inspired deduction challenge tested our communication, active listening, and intuition under pressure.

Then came the classic Spaghetti Tower Challenge. Armed only with fragile dry spaghetti sticks, masking tape, string, and a single marshmallow destined for the top, the clock started ticking. We experienced early structural collapses, rapid pivots, and constant negotiation of ideas.

> **Key Takeaway:** We stopped being separate people sitting at the same table and became a team that builds, tests, and iterates together.

---

### Day 4: Exploring AI & Purposeful Technology
*Theme: Explore & Elevate*

Technology is only as effective as the intention behind it. On Day 4, a TED-style talk on modern AI workflows challenged us to move past generic prompting and view AI tools as specialized instruments for specific tasks.

We explored how tailoring and personalizing AI frameworks can amplify brainstorming, research, and rapid prototyping without replacing human critical thinking.

> **Key Takeaway:** Don't use technology just because it's new—use the right tool with deliberate intention to solve the right problem.

---

### Day 5: The Spark of Entrepreneurship
*Theme: Ignite & Envision*

We concluded our first week with the official inauguration of the Youth Entrepreneurship Program (YEP). The highlight of the day was an insightful address by Mr. M. Ramakrishnan, Founder & MD/CEO of Thulasi Pharmacies.

Hearing his real-world journey of building a customer-centric enterprise from the ground up grounded everything we had learned all week. It connected our classroom exercises to genuine societal impact, sustainable business practices, and long-term resilience.

> **Key Takeaway:** Great ventures aren’t born in isolation; they are built when empathy, disciplined execution, and a clear purpose meet real market needs.

---

## 5 Core Lessons We’re Taking Forward

1. **Connection First:** Real collaboration only begins after you cultivate trust and openness.
2. **Empathy-Driven Problem Identification:** The most impactful solutions come from deeply observing daily friction points.
3. **Cognitive Synergy:** Diverse personalities and backgrounds are a superpower when aligned toward a shared goal.
4. **Iterative Action Over Perfection:** Building messy prototypes teaches you faster than endless theoretical debates.
5. **Intentional Innovation:** Whether leveraging advanced AI or designing a business model, purpose must always lead technology.

---

## Looking Ahead

Week 0 at Protosem proved that interdisciplinary learning is more than an academic buzzword—it is a mindset. As we transition into the next phase of deep-dive problem solving and prototyping, we carry forward a shared identity, a strong foundation of trust, and the confidence to create together.

> *"Protosem didn’t just teach us new concepts. It taught us how different people can connect, think differently, and build together."*`

    function Icon({ name, className = "w-4 h-4", ...props }) {
      const icon = SVG_ICONS[name];
      if (!icon) return null;
      return (
        <span className={`inline-flex items-center justify-center ${className}`} {...props}>
          {icon}
        </span>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-ivory text-ink flex items-center justify-center p-6 text-center font-mono-tag">
              <div className="p-8 bg-white border border-ivory-border rounded shadow-xl space-y-4 max-w-md">
                <span className="text-emeraldAccent text-2xl font-bold block">DAKSHANA SRI M</span>
                <p className="text-xs text-ink-muted">A temporary display state was caught and recovered.</p>
                <button
                  onClick={() => {
                    localStorage.removeItem("dakshana_portfolio_v2_data");
                    window.location.reload();
                  }}
                  className="px-4 py-2 bg-emeraldAccent text-white text-xs font-bold rounded"
                >
                  RELOAD PORTFOLIO
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function DynamicCursor() {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [trailingPos, setTrailingPos] = useState({ x: -100, y: -100 });
      const [hovered, setHovered] = useState(false);
      const [clicking, setClicking] = useState(false);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        let currentTrailing = { x: -100, y: -100 };
        let targetPos = { x: -100, y: -100 };
        let animationFrameId;

        const onMouseMove = (e) => {
          targetPos = { x: e.clientX, y: e.clientY };
          setPos({ x: e.clientX, y: e.clientY });
          if (!visible) setVisible(true);

          const target = e.target;
          const isInteractive = target && target.closest && target.closest('a, button, input, textarea, select, [role="button"], label, .cursor-pointer, .paper-card');
          setHovered(!!isInteractive);
        };

        const onMouseDown = () => setClicking(true);
        const onMouseUp = () => setClicking(false);
        const onMouseLeave = () => setVisible(false);
        const onMouseEnter = () => setVisible(true);

        const animateTrailing = () => {
          currentTrailing.x += (targetPos.x - currentTrailing.x) * 0.18;
          currentTrailing.y += (targetPos.y - currentTrailing.y) * 0.18;
          setTrailingPos({ x: currentTrailing.x, y: currentTrailing.y });
          animationFrameId = requestAnimationFrame(animateTrailing);
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        document.body.addEventListener('mouseleave', onMouseLeave);
        document.body.addEventListener('mouseenter', onMouseEnter);

        animationFrameId = requestAnimationFrame(animateTrailing);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mouseup', onMouseUp);
          document.body.removeEventListener('mouseleave', onMouseLeave);
          document.body.removeEventListener('mouseenter', onMouseEnter);
          cancelAnimationFrame(animationFrameId);
        };
      }, [visible]);

      if (!visible) return null;

      return (
        <React.Fragment>
          <div
            className={`cursor-ring ${hovered ? 'hovered' : ''} ${clicking ? 'clicking' : ''}`}
            style={{ left: `${trailingPos.x}px`, top: `${trailingPos.y}px` }}
          />
          <div
            className={`cursor-dot ${hovered ? 'hovered' : ''}`}
            style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
          />
        </React.Fragment>
      );
    }

    function ImageLightbox({ src, alt, caption, onClose }) {
      if (!src) return null;
      const isPdf = src.toLowerCase().endsWith('.pdf');
      const isResume = src.toLowerCase().includes('resume') || (alt && alt.toLowerCase().includes('resume'));
      const [viewMode, setViewMode] = React.useState(isPdf ? 'pdf' : 'default');
      const [currentSrc, setCurrentSrc] = React.useState(src);

      React.useEffect(() => {
        setCurrentSrc(src);
        setViewMode(src.toLowerCase().endsWith('.pdf') ? 'pdf' : 'default');

      return (
        <div className="fixed inset-0 z-50 bg-ink/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6" onClick={onClose}>

                        setViewMode('pdf');
                        setCurrentSrc("assets/resume/dakshana_sri_m_resume.pdf");

                      className={`px-2.5 py-1 rounded transition-colors ${viewMode === 'pdf' ? 'bg-emeraldAccent text-white font-bold' : 'text-ink-muted hover:text-ink'}`}
                    >
                      PDF VIEW

                    <button
                      onClick={() => {
                        setViewMode('interactive');
                        setCurrentSrc("assets/resume/resume_template.html");
                      }}
                      className={`px-2.5 py-1 rounded transition-colors ${viewMode === 'interactive' ? 'bg-emeraldAccent text-white font-bold' : 'text-ink-muted hover:text-ink'}`}

                  />
                  <div className="text-center pt-1 flex items-center justify-center gap-3">
                    <a
                      href="assets/resume/dakshana_sri_m_resume.pdf"
                      download
                      className="inline-flex items-center gap-2 px-4 py-2 bg-emeraldAccent text-white text-xs font-mono-tag font-bold rounded shadow hover:bg-ink transition-colors"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" />
                      <span>DOWNLOAD RESUME PDF</span>
                    </a>
                  </div>
                </div>
              ) : (
                <img
                  src={currentSrc}
                  alt={alt || "Certificate Document"}
                  className="w-full h-auto max-h-[74vh] object-contain rounded shadow"
                />
              )}
            </div>

            {caption && (
              <div className="px-5 py-2.5 bg-white border-t border-ivory-border font-mono-tag text-xs text-ink-muted">
                <span className="text-emeraldAccent font-bold">INFO: </span>
                <span>{caption}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ProtoSemBlogModal({ blog, week, weekIndex, totalWeeks, onClose, onEdit, canEdit, onNavigateWeek }) {
      if (!blog) return null;
      const [copied, setCopied] = useState(false);
      const pdfSource = blog.pdfUrl || (blog.attachedDoc && (blog.attachedDoc.startsWith("data:application/pdf") || blog.attachedDoc.toLowerCase().endsWith(".pdf") || (blog.attachedDocName && blog.attachedDocName.toLowerCase().endsWith(".pdf")) || blog.attachedDoc.startsWith("assets/")) ? blog.attachedDoc : null);
      const [activeView, setActiveView] = useState(pdfSource ? "pdf" : "essay");

      const handleCopyLink = () => {
        const url = window.location.origin + window.location.pathname + `#protosem-week-${weekIndex}`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
        }
      };

      const handlePrint = () => {
        window.print();
      };

      const handleDownloadAsWord = () => {
        const docTitle = blog.title || `ProtoSem_Week_${weekIndex}_Retrospective`;
        const htmlDoc = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head>
            <meta charset='utf-8'>
            <title>${docTitle}</title>
            <style>
              body { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #151515; padding: 24pt; }
              h1 { color: #1B4D3E; font-size: 24pt; margin-bottom: 6pt; font-family: 'Georgia', serif; font-weight: bold; }
              h2 { color: #1B4D3E; font-size: 16pt; margin-top: 18pt; margin-bottom: 6pt; border-bottom: 1.5pt solid #1B4D3E; padding-bottom: 4pt; }
              h3 { color: #286B57; font-size: 13pt; margin-top: 14pt; margin-bottom: 4pt; }
              p { font-size: 11pt; margin-bottom: 10pt; line-height: 1.6; }
              blockquote { border-left: 3pt solid #1B4D3E; margin: 12pt 0; padding: 6pt 12pt; background-color: #F4F1EA; font-style: italic; color: #333; }
              .meta-bar { font-size: 10pt; color: #555; margin-bottom: 16pt; border-bottom: 1pt solid #DDD; padding-bottom: 8pt; }
              .highlight-box { background: #FAF8F5; border: 1.5pt solid #1B4D3E; padding: 12pt; margin: 14pt 0; border-radius: 4pt; }
              ul { margin: 6pt 0 12pt 20pt; }
              li { margin-bottom: 4pt; font-size: 11pt; }
            </style>
          </head>
          <body>
            <h1>${blog.title || `ProtoSem Week ${week?.label || weekIndex} Retrospective`}</h1>
            <div class="meta-bar">
              <strong>Author:</strong> ${blog.author || "Dakshana Sri M"} &nbsp;|&nbsp; 
              <strong>Sprint:</strong> ProtoSem ${week?.label || `Week ${weekIndex}`} &nbsp;|&nbsp; 
              <strong>Date:</strong> ${blog.date || "August 2026"} &nbsp;|&nbsp; 
              <strong>Read Time:</strong> ${blog.readTime || "5 min read"}
            </div>
            ${blog.summary ? `<p style="font-size:12pt; font-style:italic; color:#2C2B29; background-color:#F4F1EA; padding:10pt; border-left:3pt solid #1B4D3E;">${blog.summary}</p>` : ''}
            
            ${blog.highlights && blog.highlights.length > 0 ? `
              <div class="highlight-box">
                <strong style="color:#1B4D3E; text-transform:uppercase; font-size:10.5pt; display:block; margin-bottom:6pt;">Key Sprint Breakthroughs & Mental Models</strong>
                <ul>
                  ${blog.highlights.map(h => `<li><strong>${h}</strong></li>`).join('')}
                </ul>
              </div>
            ` : ''}

            <hr style="border:0; border-top:1pt solid #DDD; margin: 16pt 0;" />
            
            ${(blog.content || '').split('\n').map(line => {
          const trimmed = line.trim();
          if (trimmed.startsWith('## ')) return `<h2>${trimmed.replace('## ', '')}</h2>`;
          if (trimmed.startsWith('### ')) return `<h3>${trimmed.replace('### ', '')}</h3>`;
          if (trimmed.startsWith('> ')) return `<blockquote>${trimmed.replace('> ', '')}</blockquote>`;
          if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) return `<li>${trimmed.substring(2)}</li>`;
          if (trimmed === '') return '';
          return `<p>${trimmed}</p>`;
        }).join('\n')}

            <hr style="border:0; border-top:1pt solid #DDD; margin: 20pt 0;" />
            <p style="font-size:9pt; color:#888; text-align:center;">
              Dakshana Sri M · ProtoSem Venture Building & Rapid Prototyping Portfolio · ${blog.date || 'August 2026'}
            </p>
          </body>
          </html>
        `;

        const blob = new Blob(['\ufeff', htmlDoc], {
          type: 'application/msword'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const cleanName = (blog.title || `ProtoSem_Week_${weekIndex}_Retrospective`).replace(/[^a-zA-Z0-9_-]/g, '_');
        a.download = `${cleanName}.doc`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      const renderFormattedContent = (text) => {
        if (!text) return null;
        const lines = text.split('\n');
        const elements = [];
        let currentList = [];

        const flushList = () => {
          if (currentList.length > 0) {
            elements.push(
              <ul key={`list-${elements.length}`} className="my-4 space-y-2 pl-2">
                {currentList.map((item, i) => (
                  <li key={i} className="flex items-start gap-2.5 text-ink text-sm sm:text-base leading-relaxed">
                    <span className="w-1.5 h-1.5 rounded-full bg-emeraldAccent mt-2.5 flex-shrink-0"></span>
                    <span>{item}</span>
                  </li>
                ))}
              </ul>
            );
            currentList = [];
          }
        };

        lines.forEach((line, idx) => {
          const trimmed = line.trim();
          if (trimmed.startsWith('## ')) {
            flushList();
            elements.push(
              <h2 key={idx} className="font-editorial text-2xl sm:text-3xl text-ink font-bold mt-8 mb-4 border-b border-ivory-border pb-2">
                {trimmed.replace('## ', '')}
              </h2>
            );
          } else if (trimmed.startsWith('### ')) {
            flushList();
            elements.push(
              <h3 key={idx} className="font-editorial text-xl sm:text-2xl text-ink font-semibold mt-6 mb-3 flex items-center gap-2">
                <span className="w-2 h-2 rounded bg-emeraldAccent"></span>
                <span>{trimmed.replace('### ', '')}</span>
              </h3>
            );
          } else if (trimmed.startsWith('> ')) {
            flushList();
            elements.push(
              <blockquote key={idx} className="my-6 p-5 bg-ivory-light/90 border-l-4 border-emeraldAccent rounded-r italic text-ink text-base sm:text-lg font-serif">
                {trimmed.replace('> ', '')}
              </blockquote>
            );
          } else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
            currentList.push(trimmed.substring(2));
          } else if (/^\d+\.\s/.test(trimmed)) {
            flushList();
            const num = trimmed.match(/^\d+/)[0];
            const itemText = trimmed.replace(/^\d+\.\s/, '');
            elements.push(
              <div key={idx} className="flex items-start gap-3 my-2.5 text-sm sm:text-base text-ink leading-relaxed">
                <span className="font-mono-tag text-xs font-bold px-2 py-0.5 rounded bg-emeraldAccent-dim text-emeraldAccent mt-0.5">
                  {num}
                </span>
                <span>{itemText}</span>
              </div>
            );
          } else if (trimmed === '') {
            flushList();
          } else {
            flushList();
            elements.push(
              <p key={idx} className="text-ink text-sm sm:text-base leading-relaxed my-3 font-light">
                {trimmed}
              </p>
            );
          }
        });

        flushList();
        return elements;
      };

      return (
        <div className="fixed inset-0 z-50 bg-ink/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 lg:p-6 overflow-y-auto" onClick={onClose}>
          <div
            className="w-full max-w-5xl bg-white rounded-sm border border-ivory-border shadow-2xl flex flex-col my-auto max-h-[94vh] overflow-hidden"
            onClick={e => e.stopPropagation()}
          >
            {/* Sticky Top Bar */}
            <div className="flex flex-wrap items-center justify-between px-5 sm:px-8 py-3.5 border-b border-ivory-border bg-ivory-light gap-3">
              <div className="flex items-center gap-3">
                <span className="px-2.5 py-0.5 rounded bg-emeraldAccent text-white font-mono-tag text-[10px] font-bold tracking-wider">
                  {week?.label || `W0${weekIndex}`}
                </span>
                <span className="font-mono-tag text-xs text-ink font-semibold hidden sm:inline">
                  PROTOSEM SPRINT RETROSPECTIVE
                </span>

                {/* View Switcher Tabs (PDF vs Editorial Essay) */}
                {pdfSource && (
                  <div className="flex bg-white rounded border border-ivory-border p-0.5 font-mono-tag text-xs">
                    <button
                      onClick={() => setActiveView("pdf")}
                      className={`px-3 py-1 rounded transition-colors flex items-center gap-1.5 ${activeView === "pdf" ? "bg-emeraldAccent text-white font-bold shadow-xs" : "text-ink-muted hover:text-ink"}`}
                    >
                      <Icon name="file-pdf" className="w-3.5 h-3.5" />
                      <span>📄 PDF VIEWER</span>
                    </button>
                    <button
                      onClick={() => setActiveView("essay")}
                      className={`px-3 py-1 rounded transition-colors flex items-center gap-1.5 ${activeView === "essay" ? "bg-emeraldAccent text-white font-bold shadow-xs" : "text-ink-muted hover:text-ink"}`}
                    >
                      <Icon name="book-open" className="w-3.5 h-3.5" />
                      <span>📖 ESSAY VIEW</span>
                    </button>
                  </div>
                )}
              </div>

              <div className="flex items-center gap-2">
                {/* Download PDF Button */}
                {pdfSource && (
                  <a
                    href={pdfSource}
                    download={blog.pdfName || blog.attachedDocName || `${(blog.title || 'ProtoSem_Week_0').replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`}
                    className="px-3 py-1 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded flex items-center gap-1.5 hover:bg-ink transition-colors shadow-xs"
                    title="Download original PDF document"
                  >
                    <Icon name="download" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">DOWNLOAD PDF</span>
                  </a>
                )}

                {/* Print / Save to PDF */}
                <button
                  onClick={handlePrint}
                  className="px-2.5 py-1 bg-white border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs rounded flex items-center gap-1 transition-colors"
                  title="Print or Save to PDF"
                >
                  <Icon name="printer" className="w-3.5 h-3.5 text-emeraldAccent" />
                  <span className="hidden sm:inline">PRINT</span>
                </button>

                {/* Download as Word Button */}
                <button
                  onClick={handleDownloadAsWord}
                  className="px-2.5 py-1 bg-white border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs rounded flex items-center gap-1 transition-colors"
                  title="Export formatted Word Document (.doc)"
                >
                  <Icon name="file-word" className="w-3.5 h-3.5 text-emeraldAccent" />
                  <span className="hidden sm:inline">WORD</span>
                </button>

                <button
                  onClick={handleCopyLink}
                  className="p-1.5 sm:px-2.5 sm:py-1 bg-white border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs rounded flex items-center gap-1 transition-colors"
                  title="Copy link to article"
                >
                  <Icon name={copied ? "check" : "share-2"} className="w-3.5 h-3.5 text-emeraldAccent" />
                  <span className="hidden sm:inline">{copied ? "Copied!" : "Share"}</span>
                </button>

                {canEdit && (
                  <button
                    onClick={() => {
                      onClose();
                      onEdit(weekIndex);
                    }}
                    className="p-1.5 sm:px-3 sm:py-1 bg-ivory-light border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs font-bold rounded flex items-center gap-1 transition-colors"
                  >
                    <Icon name="edit-3" className="w-3.5 h-3.5 text-emeraldAccent" />
                    <span className="hidden sm:inline">Edit</span>
                  </button>
                )}

                <button
                  onClick={onClose}
                  className="p-1.5 sm:px-3 sm:py-1 bg-white border border-ivory-border hover:bg-ink hover:text-white rounded font-mono-tag text-xs font-bold transition-colors ml-1"
                >
                  ✕
                </button>
              </div>
            </div>

            {/* Modal Body: Active View */}
            {activeView === "pdf" && pdfSource ? (
              <div className="flex-1 p-4 sm:p-6 bg-ivory-card flex flex-col space-y-4 overflow-y-auto max-h-[82vh]">
                <div className="flex flex-wrap items-center justify-between gap-3 p-4 bg-white border border-ivory-border rounded-sm shadow-xs">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded bg-red-50 border border-red-200 text-red-700 flex items-center justify-center font-bold font-mono text-sm">
                      PDF
                    </div>
                    <div>
                      <h4 className="font-editorial text-xl text-ink font-bold leading-snug">
                        {blog.title || `ProtoSem Week ${weekIndex} Document`}
                      </h4>
                      <p className="font-mono-tag text-xs text-ink-muted">
                        Official 5-page sprint retrospective document · Format: Portable Document Format (.pdf)
                      </p>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <a
                      href={pdfSource}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3.5 py-2 bg-white border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs font-semibold rounded flex items-center gap-1.5 transition-colors"
                    >
                      <Icon name="external-link" className="w-3.5 h-3.5 text-emeraldAccent" />
                      <span>OPEN IN FULL TAB</span>
                    </a>

                    <a
                      href={pdfSource}
                      download={blog.pdfName || blog.attachedDocName || `${(blog.title || 'ProtoSem_Week_0').replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`}
                      className="px-4 py-2 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded shadow hover:bg-ink flex items-center gap-2 transition-colors"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" />
                      <span>DOWNLOAD ORIGINAL PDF</span>
                    </a>
                  </div>
                </div>

                {/* Embedded PDF Viewer Frame */}
                <div className="flex-1 w-full min-h-[68vh] rounded border border-ivory-border overflow-hidden bg-white shadow-inner">
                  <iframe
                    src={`${pdfSource}#toolbar=1`}
                    title={blog.title || "ProtoSem Retrospective PDF"}
                    className="w-full h-[68vh] rounded"
                  />
                </div>
              </div>
            ) : (
              /* Scrollable Editorial Essay Content */
              <div className="flex-1 overflow-y-auto px-6 sm:px-12 py-8 space-y-8 bg-paper-grain">

                {/* PDF Document Notice Banner */}
                {pdfSource && (
                  <div className="p-4 bg-emeraldAccent-dim/50 border border-emeraldAccent/40 rounded-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div className="flex items-center gap-2.5">
                      <Icon name="file-pdf" className="w-5 h-5 text-emeraldAccent flex-shrink-0" />
                      <div>
                        <span className="font-mono-tag text-xs font-bold text-ink block">
                          Official PDF Document is attached for this sprint
                        </span>
                        <span className="text-[11px] text-ink-muted font-mono-tag">
                          {blog.pdfName || "From Strangers to Innovators: Reflections on Week 0 at Protosem.pdf"}
                        </span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setActiveView("pdf")}
                        className="px-3 py-1.5 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded shadow hover:bg-ink flex items-center gap-1.5 transition-colors"
                      >
                        <Icon name="eye" className="w-3.5 h-3.5" />
                        <span>VIEW EMBEDDED PDF</span>
                      </button>
                      <a
                        href={pdfSource}
                        download={blog.pdfName || `${(blog.title || 'ProtoSem_Sprint').replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`}
                        className="px-3 py-1.5 bg-white border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs font-bold rounded flex items-center gap-1.5 transition-colors"
                      >
                        <Icon name="download" className="w-3.5 h-3.5 text-emeraldAccent" />
                        <span>DOWNLOAD</span>
                      </a>
                    </div>
                  </div>
                )}
                <div className="space-y-4 border-b border-ivory-border pb-6">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase tracking-wider">
                      WEEK {week?.weekNumber ?? weekIndex} SPRINT JOURNAL
                    </span>
                    <span className="text-ink-dim">·</span>
                    <span className="font-mono-tag text-xs text-ink-dim">{blog.date || "August 2026"}</span>
                  </div>

                  <h1 className="font-editorial text-3xl sm:text-5xl text-ink leading-tight">
                    {blog.title}
                  </h1>

                  {blog.summary && (
                    <p className="text-ink-muted text-base sm:text-lg font-serif italic leading-relaxed">
                      "{blog.summary}"
                    </p>
                  )}

                  {/* Author Card & Tags */}
                  <div className="flex flex-wrap items-center justify-between gap-4 pt-3">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded bg-emeraldAccent text-white font-editorial text-base flex items-center justify-center font-bold shadow-sm">
                        DM
                      </div>
                      <div>
                        <span className="font-mono-tag text-xs font-bold text-ink block">
                          {blog.author || "Dakshana Sri M"}
                        </span>
                        <span className="font-mono-tag text-[10px] text-ink-dim block">
                          Data Science × Venture Prototyping Fellow
                        </span>
                      </div>
                    </div>

                    {blog.tags && blog.tags.length > 0 && (
                      <div className="flex flex-wrap gap-1.5">
                        {blog.tags.map((t, idx) => (
                          <span key={idx} className="px-2.5 py-0.5 rounded-full bg-emeraldAccent-dim border border-emeraldAccent/20 text-emeraldAccent font-mono-tag text-[10px] font-semibold">
                            #{t}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* Cover Hero Image */}
                {blog.coverImage && (
                  <div className="rounded overflow-hidden border border-ivory-border shadow-sm">
                    <img src={blog.coverImage} alt={blog.title} className="w-full h-64 sm:h-96 object-cover" />
                    <div className="p-2.5 bg-ivory-light border-t border-ivory-border text-center font-mono-tag text-[10px] text-ink-dim">
                      ProtoSem Sprint Milestone · {week?.title || `Week ${weekIndex}`}
                    </div>
                  </div>
                )}

                {/* Highlights Box */}
                {blog.highlights && blog.highlights.length > 0 && (
                  <div className="p-6 bg-emeraldAccent-dim/40 border-l-4 border-emeraldAccent rounded-r-sm space-y-3 shadow-xs">
                    <div className="flex items-center gap-2 font-mono-tag text-xs text-emeraldAccent font-bold uppercase tracking-wider">
                      <Icon name="sparkles" className="w-4 h-4" />
                      <span>KEY SPRINT BREAKTHROUGHS & MENTAL MODELS</span>
                    </div>
                    <ul className="space-y-2">
                      {blog.highlights.map((h, i) => (
                        <li key={i} className="flex items-start gap-2.5 text-xs sm:text-sm text-ink font-medium">
                          <Icon name="check" className="w-3.5 h-3.5 text-emeraldAccent flex-shrink-0 mt-0.5" />
                          <span>{h}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Body Content */}
                <div className="prose max-w-none text-ink font-sans">
                  {blog.content ? (
                    renderFormattedContent(blog.content)
                  ) : (
                    <p className="text-ink-muted text-sm italic">{blog.summary}</p>
                  )}
                </div>

                {/* Word Document Attachment & Download Box */}
                <div className="p-6 sm:p-8 bg-white border border-emeraldAccent/30 rounded-sm shadow-sm space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="flex items-start gap-3">
                      <div className="w-12 h-12 rounded bg-emeraldAccent/10 border border-emeraldAccent/20 flex items-center justify-center text-emeraldAccent flex-shrink-0 mt-0.5">
                        <Icon name="file-word" className="w-6 h-6" />
                      </div>
                      <div>
                        <h4 className="font-editorial text-xl text-ink font-bold">
                          MICROSOFT WORD DOCUMENT & ESSAY ATTACHMENT
                        </h4>
                        <p className="text-xs text-ink-muted mt-1 font-mono-tag">
                          Download or export this sprint retrospective formatted for Microsoft Word (.doc/.docx) or offline editing.
                        </p>
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-2.5 self-start sm:self-auto">
                      <button
                        onClick={handleDownloadAsWord}
                        className="px-4 py-2.5 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded shadow hover:bg-ink flex items-center gap-2 transition-colors"
                      >
                        <Icon name="download" className="w-4 h-4" />
                        <span>DOWNLOAD AS WORD (.DOC)</span>
                      </button>

                      {blog.attachedDoc && (
                        <a
                          href={blog.attachedDoc}
                          download={blog.attachedDocName || `${(blog.title || 'Sprint_Essay').replace(/[^a-zA-Z0-9_-]/g, '_')}.docx`}
                          className="px-4 py-2.5 bg-white border border-emeraldAccent text-emeraldAccent hover:bg-emeraldAccent hover:text-white font-mono-tag text-xs font-bold rounded flex items-center gap-2 transition-colors"
                        >
                          <Icon name="paperclip" className="w-4 h-4" />
                          <span>DOWNLOAD ORIGINAL ATTACHED FILE</span>
                        </a>
                      )}

                      {blog.wordDocUrl && (
                        <a
                          href={blog.wordDocUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="px-4 py-2.5 bg-ivory-light border border-ivory-border hover:border-emeraldAccent text-ink font-mono-tag text-xs font-semibold rounded flex items-center gap-2 transition-colors"
                        >
                          <Icon name="external-link" className="w-4 h-4 text-emeraldAccent" />
                          <span>OPEN CLOUD DOCUMENT</span>
                        </a>
                      )}
                    </div>
                  </div>
                </div>

                {/* 5-Day Sprint Snapshot */}
                {week?.days && week.days.length > 0 && (
                  <div className="pt-8 border-t border-ivory-border space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase">
                        5-DAY SPRINT TIMELINE SNAPSHOT
                      </span>
                      <span className="font-mono-tag text-[10px] text-ink-dim">5 Daily Deliverables</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                      {week.days.map((d, dIdx) => (
                        <div key={dIdx} className="p-3 bg-white rounded border border-ivory-border shadow-xs text-xs space-y-1">
                          <span className="font-mono-tag text-[9px] text-emeraldAccent font-bold block">
                            DAY 0{d.dayNumber} · {d.theme}
                          </span>
                          <h5 className="font-bold text-ink truncate text-[11px]">{d.title}</h5>
                          <p className="text-ink-muted text-[10px] line-clamp-2">{d.takeaway || d.summary}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Author Footer Bio */}
                <div className="p-6 bg-ivory-light border border-ivory-border rounded-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded bg-ink text-white font-editorial text-lg flex items-center justify-center font-bold">
                      DM
                    </div>
                    <div>
                      <h4 className="font-editorial text-xl text-ink">Dakshana Sri M</h4>
                      <p className="text-xs text-ink-muted font-mono-tag">
                        Documenting the 20-week venture building journey from ideas to shipping prototypes.
                      </p>
                    </div>
                  </div>
                  {blog.externalUrl && (
                    <a
                      href={blog.externalUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="px-4 py-2 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded shadow hover:bg-ink transition-colors flex items-center gap-2 flex-shrink-0"
                    >
                      <span>READ ON MEDIUM / SUBSTACK</span>
                      <Icon name="external-link" className="w-3.5 h-3.5" />
                    </a>
                  )}
                </div>

                {/* Navigation Bar */}
                <div className="flex items-center justify-between pt-4 border-t border-ivory-border font-mono-tag text-xs">
                  {weekIndex > 0 ? (
                    <button
                      onClick={() => onNavigateWeek(weekIndex - 1)}
                      className="px-4 py-2 bg-white border border-ivory-border hover:border-emeraldAccent text-ink rounded flex items-center gap-2 transition-colors"
                    >
                      <Icon name="arrow-left" className="w-3.5 h-3.5" />
                      <span>WEEK {weekIndex - 1 < 10 ? '0' + (weekIndex - 1) : weekIndex - 1} ESSAY</span>
                    </button>
                  ) : <div />}

                  {weekIndex < totalWeeks - 1 ? (
                    <button
                      onClick={() => onNavigateWeek(weekIndex + 1)}
                      className="px-4 py-2 bg-white border border-ivory-border hover:border-emeraldAccent text-ink rounded flex items-center gap-2 transition-colors"
                    >
                      <span>WEEK {weekIndex + 1 < 10 ? '0' + (weekIndex + 1) : weekIndex + 1} ESSAY</span>
                      <Icon name="arrow-right" className="w-3.5 h-3.5" />
                    </button>
                  ) : <div />}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ProtoSemBlogEditorModal({ weekIndex, isNew, weeks, onClose, onSave, onDelete }) {
      const targetWeek = weeks[weekIndex] || { weekNumber: weekIndex, label: `W${weekIndex < 10 ? '0' + weekIndex : weekIndex}`, title: `Week ${weekIndex}` };
      const existingBlog = targetWeek.blog || {};

      const [selectedWeekIdx, setSelectedWeekIdx] = useState(weekIndex ?? 0);
      const [activeTab, setActiveTab] = useState("edit");
      const [title, setTitle] = useState(existingBlog.title || `Week ${targetWeek.weekNumber ?? weekIndex} Sprint Retrospective`);
      const [summary, setSummary] = useState(existingBlog.summary || "");
      const [date, setDate] = useState(existingBlog.date || "August 2026");
      const [readTime, setReadTime] = useState(existingBlog.readTime || "5 min read");
      const [tagsStr, setTagsStr] = useState(existingBlog.tags ? existingBlog.tags.join(", ") : "ProtoSem, Venture Building, Rapid Prototyping");
      const [coverImage, setCoverImage] = useState(existingBlog.coverImage || "");
      const [coverUploadMode, setCoverUploadMode] = useState("device"); // "device" or "url"
      const [externalUrl, setExternalUrl] = useState(existingBlog.externalUrl || "");
      const [attachedDoc, setAttachedDoc] = useState(existingBlog.attachedDoc || "");
      const [attachedDocName, setAttachedDocName] = useState(existingBlog.attachedDocName || "");
      const [wordDocUrl, setWordDocUrl] = useState(existingBlog.wordDocUrl || "");
      const [docUploadMode, setDocUploadMode] = useState("device"); // "device" or "url"
      const [highlightsText, setHighlightsText] = useState(existingBlog.highlights ? existingBlog.highlights.join("\n") : "");
      const [content, setContent] = useState(existingBlog.content || `## Sprint Overview\nDocumenting key deliverables, customer feedback, and technical milestones for this sprint.\n\n### Architectural Decisions & Progress\nKey data flow designs, model benchmarks, and systems integrations.\n\n### Lessons Learned & Epiphanies\nCore insights and next sprint trajectory.`);

      const handleWeekChange = (newIdx) => {
        setSelectedWeekIdx(newIdx);
        const w = weeks[newIdx];
        if (w && w.blog) {
          setTitle(w.blog.title || `Week ${newIdx} Sprint Retrospective`);
          setSummary(w.blog.summary || "");
          setDate(w.blog.date || "August 2026");
          setReadTime(w.blog.readTime || "5 min read");
          setTagsStr(w.blog.tags ? w.blog.tags.join(", ") : "ProtoSem, Sprint");
          setCoverImage(w.blog.coverImage || "");
          setExternalUrl(w.blog.externalUrl || "");
          setAttachedDoc(w.blog.attachedDoc || "");
          setAttachedDocName(w.blog.attachedDocName || "");
          setWordDocUrl(w.blog.wordDocUrl || "");
          setHighlightsText(w.blog.highlights ? w.blog.highlights.join("\n") : "");
          setContent(w.blog.content || "");
        } else {
          setTitle(`Week ${newIdx} Sprint Retrospective`);
          setSummary("");
          setHighlightsText("");
          setAttachedDoc("");
          setAttachedDocName("");
          setWordDocUrl("");
          setContent(`## Sprint Overview\nKey learnings and deliverables for Week ${newIdx}.`);
        }
      };

      const insertMarkdown = (prefix, suffix = "") => {
        setContent(prev => prev + `\n\n${prefix}Heading / Text${suffix}\n`);
      };

      const handleSave = () => {
        if (!title.trim()) {
          alert("Please provide a blog title.");
          return;
        }
        const tags = tagsStr.split(',').map(t => t.trim()).filter(Boolean);
        const highlights = highlightsText.split('\n').map(h => h.trim()).filter(Boolean);

        const updatedBlog = {
          title: title.trim(),
          summary: summary.trim(),
          date: date.trim(),
          readTime: readTime.trim(),
          tags,
          coverImage: coverImage.trim(),
          externalUrl: externalUrl.trim(),
          attachedDoc: attachedDoc.trim(),
          attachedDocName: attachedDocName.trim(),
          wordDocUrl: wordDocUrl.trim(),
          highlights,
          content: content.trim(),
          author: "Dakshana Sri M"
        };

        onSave(selectedWeekIdx, updatedBlog);
      };

      return (
        <div className="fixed inset-0 z-50 bg-ink/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 lg:p-6 overflow-y-auto" onClick={onClose}>
          <div
            className="w-full max-w-4xl bg-white rounded-sm border border-ivory-border shadow-2xl flex flex-col my-auto max-h-[94vh] overflow-hidden"
            onClick={e => e.stopPropagation()}
          >
            {/* Top Bar */}
            <div className="flex items-center justify-between px-5 sm:px-8 py-3.5 border-b border-ivory-border bg-ivory-light">
              <div className="flex items-center gap-3">
                <span className="w-2.5 h-2.5 rounded-full bg-emeraldAccent animate-pulse"></span>
                <span className="font-mono-tag text-xs font-bold text-ink uppercase">
                  {isNew ? "CREATE PROTOSEM SPRINT BLOG" : "EDIT PROTOSEM BLOG POST"}
                </span>
              </div>

              <div className="flex items-center gap-2">
                <div className="flex bg-white rounded border border-ivory-border p-0.5 font-mono-tag text-xs">
                  <button
                    onClick={() => setActiveTab("edit")}
                    className={`px-3 py-1 rounded transition-colors ${activeTab === "edit" ? "bg-emeraldAccent text-white font-bold" : "text-ink-muted hover:text-ink"}`}
                  >
                    ✏️ WRITE
                  </button>
                  <button
                    onClick={() => setActiveTab("preview")}
                    className={`px-3 py-1 rounded transition-colors ${activeTab === "preview" ? "bg-emeraldAccent text-white font-bold" : "text-ink-muted hover:text-ink"}`}
                  >
                    👁️ PREVIEW
                  </button>
                </div>

                <button
                  onClick={onClose}
                  className="p-1.5 sm:px-3 sm:py-1 bg-white border border-ivory-border hover:bg-ink hover:text-white rounded font-mono-tag text-xs font-bold transition-colors ml-2"
                >
                  ✕
                </button>
              </div>
            </div>

            {/* Form Body */}
            <div className="flex-1 overflow-y-auto px-6 sm:px-10 py-6 space-y-6">

              {activeTab === "edit" ? (
                <div className="space-y-5">
                  {/* Week Selector */}
                  <div className="p-4 bg-ivory-light border border-ivory-border rounded-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <label className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase block mb-1">
                        SELECT PROTOSEM WEEK FOR THIS BLOG
                      </label>
                      <p className="text-xs text-ink-muted">Attach or write this blog for any week across the 20-week trajectory.</p>
                    </div>
                    <select
                      value={selectedWeekIdx}
                      onChange={(e) => handleWeekChange(parseInt(e.target.value))}
                      className="px-3 py-2 bg-white border border-ivory-border rounded font-mono-tag text-xs font-bold text-ink focus:border-emeraldAccent focus:outline-hidden"
                    >
                      {weeks.map((w, idx) => (
                        <option key={idx} value={idx}>
                          {w.label}: {w.title || `Week ${idx}`} {w.blog?.title ? "✓ (Has Blog)" : "(No Blog)"}
                        </option>
                      ))}
                      {/* Allow choosing weeks beyond current weeks array up to 20 */}
                      {Array.from({ length: 20 }).map((_, i) => {
                        if (i >= weeks.length) {
                          return (
                            <option key={i} value={i}>
                              W{i < 10 ? '0' + i : i}: Week {i} (+ Create New Week & Blog)
                            </option>
                          );
                        }
                        return null;
                      })}
                    </select>
                  </div>

                  {/* Title & Excerpt */}
                  <div className="space-y-4">
                    <div>
                      <label className="font-mono-tag text-xs text-ink-muted font-semibold uppercase block mb-1">
                        BLOG ARTICLE TITLE *
                      </label>
                      <input
                        type="text"
                        value={title}
                        onChange={(e) => setTitle(e.target.value)}
                        placeholder="e.g., Sprint 02 Retrospective: Building High-Throughput Ingestion Pipelines"
                        className="w-full px-4 py-2.5 bg-white border border-ivory-border rounded font-editorial text-xl text-ink focus:border-emeraldAccent focus:outline-hidden"
                      />
                    </div>

                    <div>
                      <label className="font-mono-tag text-xs text-ink-muted font-semibold uppercase block mb-1">
                        SUMMARY / EXCERPT
                      </label>
                      <textarea
                        rows={2}
                        value={summary}
                        onChange={(e) => setSummary(e.target.value)}
                        placeholder="A concise 1-2 sentence executive overview of this week's prototyping journey..."
                        className="w-full px-3 py-2 bg-white border border-ivory-border rounded font-sans text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                      ></textarea>
                    </div>
                  </div>

                  {/* Metadata Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                      <label className="font-mono-tag text-xs text-ink-muted font-semibold uppercase block mb-1">
                        DATE
                      </label>
                      <input
                        type="text"
                        value={date}
                        onChange={(e) => setDate(e.target.value)}
                        placeholder="August 2026"
                        className="w-full px-3 py-2 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                      />
                    </div>

                    <div>
                      <label className="font-mono-tag text-xs text-ink-muted font-semibold uppercase block mb-1">
                        READ TIME
                      </label>
                      <input
                        type="text"
                        value={readTime}
                        onChange={(e) => setReadTime(e.target.value)}
                        placeholder="5 min read"
                        className="w-full px-3 py-2 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                      />
                    </div>

                    <div className="sm:col-span-2">
                      <label className="font-mono-tag text-xs text-ink-muted font-semibold uppercase block mb-1">
                        TAGS (COMMA-SEPARATED)
                      </label>
                      <input
                        type="text"
                        value={tagsStr}
                        onChange={(e) => setTagsStr(e.target.value)}
                        placeholder="ProtoSem, Retrospective, Venture Building, Machine Learning"
                        className="w-full px-3 py-2 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                      />
                    </div>
                  </div>

                  {/* Word Document & Essay Attachment Section */}
                  <div className="p-5 bg-ivory-light border border-emeraldAccent/30 rounded-sm space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2">
                          <Icon name="file-word" className="w-4 h-4 text-emeraldAccent" />
                          <label className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase">
                            ATTACH WORD DOCUMENT / ESSAY FILE (.DOCX, .DOC, .PDF)
                          </label>
                        </div>
                        <span className="text-xs text-ink-muted">Attach an offline Word document file or link to OneDrive/Google Docs so readers can download or view the document.</span>
                      </div>

                      {/* Mode Switcher Tabs */}
                      <div className="flex bg-white rounded border border-ivory-border p-0.5 font-mono-tag text-xs self-start sm:self-auto">
                        <button
                          type="button"
                          onClick={() => setDocUploadMode("device")}
                          className={`px-3 py-1 rounded transition-colors flex items-center gap-1.5 ${docUploadMode === "device" ? "bg-emeraldAccent text-white font-bold" : "text-ink-muted hover:text-ink"}`}
                        >
                          <Icon name="upload" className="w-3 h-3" />
                          <span>📁 FROM DEVICE</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setDocUploadMode("url")}
                          className={`px-3 py-1 rounded transition-colors flex items-center gap-1.5 ${docUploadMode === "url" ? "bg-emeraldAccent text-white font-bold" : "text-ink-muted hover:text-ink"}`}
                        >
                          <Icon name="external-link" className="w-3 h-3" />
                          <span>🔗 CLOUD LINK</span>
                        </button>
                      </div>
                    </div>

                    {/* Mode A: Upload Word File from Device */}
                    {docUploadMode === "device" && (
                      <div>
                        <label className="border-2 border-dashed border-emeraldAccent/30 hover:border-emeraldAccent bg-white rounded-sm p-5 flex flex-col items-center justify-center cursor-pointer group transition-all text-center">
                          <Icon name="file-word" className="w-8 h-8 text-emeraldAccent mb-2 group-hover:scale-110 transition-transform" />
                          <span className="font-mono-tag text-xs font-bold text-ink group-hover:text-emeraldAccent">
                            CLICK TO CHOOSE WORD DOCUMENT (.DOCX, .DOC, .PDF)
                          </span>
                          <span className="text-[11px] text-ink-dim mt-1 font-mono-tag">
                            Supports Microsoft Word .docx, .doc, .pdf, .md, .txt (Max 25MB)
                          </span>
                          <input
                            type="file"
                            accept=".docx,.doc,.pdf,.txt,.md,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,application/pdf"
                            className="hidden"
                            onChange={(e) => {
                              const file = e.target.files?.[0];
                              if (file) {
                                if (file.size > 25 * 1024 * 1024) {
                                  alert("File is too large (max 25MB).");
                                  return;
                                }
                                setAttachedDocName(file.name);
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                  setAttachedDoc(ev.target.result);
                                };
                                reader.readAsDataURL(file);
                              }
                            }}
                          />
                        </label>
                      </div>
                    )}

                    {/* Mode B: Cloud Document URL */}
                    {docUploadMode === "url" && (
                      <div className="space-y-2">
                        <div className="relative">
                          <Icon name="external-link" className="w-3.5 h-3.5 text-ink-dim absolute left-3 top-1/2 -translate-y-1/2" />
                          <input
                            type="url"
                            value={wordDocUrl}
                            onChange={(e) => setWordDocUrl(e.target.value)}
                            placeholder="Paste link to Microsoft 365, OneDrive, SharePoint, or Google Docs..."
                            className="w-full pl-9 pr-3 py-2.5 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                          />
                        </div>
                        <p className="text-[11px] text-ink-dim font-mono-tag">
                          Paste any shareable cloud document link (OneDrive, Google Docs, Notion, or GitHub doc).
                        </p>
                      </div>
                    )}

                    {/* Attached Document Pill & Preview */}
                    {(attachedDoc || attachedDocName || wordDocUrl) && (
                      <div className="p-3 bg-white border border-emeraldAccent/30 rounded flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <div className="w-9 h-9 rounded bg-emeraldAccent/10 flex items-center justify-center text-emeraldAccent">
                            <Icon name="file-word" className="w-5 h-5" />
                          </div>
                          <div>
                            <span className="font-mono-tag text-xs font-bold text-ink block">
                              {attachedDocName || (wordDocUrl ? "Cloud Word Document Linked" : "Word Document Attached")}
                            </span>
                            <span className="font-mono-tag text-[10px] text-ink-dim truncate max-w-xs sm:max-w-md block">
                              {wordDocUrl ? wordDocUrl : (attachedDoc ? "Attached from local file system" : "")}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          {attachedDoc && (
                            <a
                              href={attachedDoc}
                              download={attachedDocName || "Sprint_Essay.docx"}
                              className="px-2.5 py-1 bg-emeraldAccent text-white rounded font-mono-tag text-xs font-bold flex items-center gap-1 hover:bg-ink transition-colors"
                            >
                              <Icon name="download" className="w-3 h-3" />
                              <span>Test Download</span>
                            </a>
                          )}
                          <button
                            type="button"
                            onClick={() => {
                              setAttachedDoc("");
                              setAttachedDocName("");
                              setWordDocUrl("");
                            }}
                            className="px-2.5 py-1 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 rounded font-mono-tag text-xs font-bold flex items-center gap-1 transition-colors"
                          >
                            <Icon name="trash-2" className="w-3 h-3" />
                            <span>Remove</span>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Cover Image Uploader (Dual-Mode: Upload from Device + Paste URL) */}
                  <div className="p-5 bg-ivory-light border border-ivory-border rounded-sm space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <label className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase block">
                          COVER HERO IMAGE
                        </label>
                        <span className="text-xs text-ink-muted">Upload an image file directly from your computer/device or paste a web URL.</span>
                      </div>

                      {/* Mode Switcher Tabs */}
                      <div className="flex bg-white rounded border border-ivory-border p-0.5 font-mono-tag text-xs self-start sm:self-auto">
                        <button
                          type="button"
                          onClick={() => setCoverUploadMode("device")}
                          className={`px-3 py-1 rounded transition-colors flex items-center gap-1.5 ${coverUploadMode === "device" ? "bg-emeraldAccent text-white font-bold" : "text-ink-muted hover:text-ink"}`}
                        >
                          <Icon name="upload" className="w-3 h-3" />
                          <span>📁 FROM DEVICE</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setCoverUploadMode("url")}
                          className={`px-3 py-1 rounded transition-colors flex items-center gap-1.5 ${coverUploadMode === "url" ? "bg-emeraldAccent text-white font-bold" : "text-ink-muted hover:text-ink"}`}
                        >
                          <Icon name="external-link" className="w-3 h-3" />
                          <span>🔗 FROM URL</span>
                        </button>
                      </div>
                    </div>

                    {/* Mode A: Upload from Device */}
                    {coverUploadMode === "device" && (
                      <div>
                        <label className="border-2 border-dashed border-ivory-darkBorder hover:border-emeraldAccent bg-white rounded-sm p-6 flex flex-col items-center justify-center cursor-pointer group transition-all text-center">
                          <Icon name="image" className="w-8 h-8 text-emeraldAccent mb-2 group-hover:scale-110 transition-transform" />
                          <span className="font-mono-tag text-xs font-bold text-ink group-hover:text-emeraldAccent">
                            CLICK TO CHOOSE IMAGE FROM YOUR DEVICE
                          </span>
                          <span className="text-[11px] text-ink-dim mt-1 font-mono-tag">
                            Supports JPG, PNG, WEBP, GIF (Max 15MB)
                          </span>
                          <input
                            type="file"
                            accept="image/*"
                            className="hidden"
                            onChange={(e) => {
                              const file = e.target.files?.[0];
                              if (file) {
                                if (file.size > 15 * 1024 * 1024) {
                                  alert("File is too large (max 15MB).");
                                  return;
                                }
                                const reader = new FileReader();
                                reader.onload = (ev) => setCoverImage(ev.target.result);
                                reader.readAsDataURL(file);
                              }
                            }}
                          />
                        </label>
                      </div>
                    )}

                    {/* Mode B: Paste from URL */}
                    {coverUploadMode === "url" && (
                      <div className="space-y-2">
                        <div className="flex gap-2">
                          <div className="relative flex-1">
                            <Icon name="external-link" className="w-3.5 h-3.5 text-ink-dim absolute left-3 top-1/2 -translate-y-1/2" />
                            <input
                              type="url"
                              value={coverImage}
                              onChange={(e) => setCoverImage(e.target.value)}
                              placeholder="Paste direct image URL (e.g. https://images.unsplash.com/... or any online image)"
                              className="w-full pl-9 pr-3 py-2.5 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                            />
                          </div>
                          {coverImage && (
                            <button
                              type="button"
                              onClick={() => setCoverImage("")}
                              className="px-3 py-2 bg-white border border-ivory-border text-red-600 hover:bg-red-50 font-mono-tag text-xs rounded transition-colors"
                            >
                              Clear
                            </button>
                          )}
                        </div>
                        <p className="text-[11px] text-ink-dim font-mono-tag">
                          Paste any direct public image link from Unsplash, Imgur, GitHub, Cloudinary, or web hosting.
                        </p>
                      </div>
                    )}

                    {/* Attached Image Preview */}
                    {coverImage && (
                      <div className="p-3 bg-white border border-ivory-border rounded flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                          <img src={coverImage} alt="Cover preview" className="w-16 h-12 object-cover rounded border border-ivory-border" />
                          <div>
                            <span className="font-mono-tag text-xs font-bold text-ink block">Cover Image Attached</span>
                            <span className="font-mono-tag text-[10px] text-ink-dim truncate max-w-xs sm:max-w-md block">
                              {coverImage.startsWith('data:') ? 'Local file uploaded from your device' : coverImage}
                            </span>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={() => setCoverImage("")}
                          className="px-2.5 py-1 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 rounded font-mono-tag text-xs font-bold flex items-center gap-1 transition-colors"
                        >
                          <Icon name="trash-2" className="w-3 h-3" />
                          <span>Remove</span>
                        </button>
                      </div>
                    )}
                  </div>

                  {/* External Link */}
                  <div>
                    <label className="font-mono-tag text-xs text-ink-muted font-semibold uppercase block mb-1">
                      EXTERNAL PUBLICATION URL (MEDIUM / LINKEDIN / SUBSTACK)
                    </label>
                    <input
                      type="url"
                      value={externalUrl}
                      onChange={(e) => setExternalUrl(e.target.value)}
                      placeholder="https://medium.com/@dakshana/... (optional)"
                      className="w-full px-3 py-2 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                    />
                  </div>

                  {/* Key Highlights */}
                  <div>
                    <label className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase block mb-1">
                      KEY SPRINT BREAKTHROUGHS & HIGHLIGHTS (ONE PER LINE)
                    </label>
                    <textarea
                      rows={3}
                      value={highlightsText}
                      onChange={(e) => setHighlightsText(e.target.value)}
                      placeholder="Broke discipline silos within 48 hours.&#10;Delivered 40x speedup with vectorized Python transformations.&#10;Gathered positive mentor feedback on prototype accuracy."
                      className="w-full px-3 py-2 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink focus:border-emeraldAccent focus:outline-hidden"
                    ></textarea>
                  </div>

                  {/* Markdown Content Editor */}
                  <div>
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                      <label className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase">
                        FULL ARTICLE CONTENT (SUPPORTS MARKDOWN FORMATTING)
                      </label>
                      <div className="flex flex-wrap gap-1 font-mono-tag text-[10px]">
                        <button type="button" onClick={() => insertMarkdown('## ')} className="px-2 py-0.5 bg-ivory-light border border-ivory-border rounded hover:bg-emeraldAccent hover:text-white">
                          + Section (##)
                        </button>
                        <button type="button" onClick={() => insertMarkdown('### ')} className="px-2 py-0.5 bg-ivory-light border border-ivory-border rounded hover:bg-emeraldAccent hover:text-white">
                          + Subhead (###)
                        </button>
                        <button type="button" onClick={() => insertMarkdown('> ')} className="px-2 py-0.5 bg-ivory-light border border-ivory-border rounded hover:bg-emeraldAccent hover:text-white">
                          + Quote (&gt;)
                        </button>
                        <button type="button" onClick={() => insertMarkdown('- ')} className="px-2 py-0.5 bg-ivory-light border border-ivory-border rounded hover:bg-emeraldAccent hover:text-white">
                          + Bullet (-)
                        </button>
                        <button type="button" onClick={() => insertMarkdown('**', '**')} className="px-2 py-0.5 bg-ivory-light border border-ivory-border rounded hover:bg-emeraldAccent hover:text-white">
                          + Bold (**)
                        </button>
                      </div>
                    </div>

                    <textarea
                      rows={10}
                      value={content}
                      onChange={(e) => setContent(e.target.value)}
                      placeholder="Write your in-depth sprint essay here using markdown headings (##, ###), blockquotes (>), lists (-), and paragraphs..."
                      className="w-full px-4 py-3 bg-white border border-ivory-border rounded font-mono-tag text-xs text-ink leading-relaxed focus:border-emeraldAccent focus:outline-hidden"
                    ></textarea>
                  </div>

                </div>
              ) : (
                /* Live Preview */
                <div className="space-y-6 bg-paper-grain p-6 sm:p-8 rounded border border-ivory-border">
                  <div className="space-y-2 border-b border-ivory-border pb-4">
                    <span className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase">
                      WEEK {weeks[selectedWeekIdx]?.weekNumber ?? selectedWeekIdx} RETROSPECTIVE · {date} · {readTime}
                    </span>
                    <h2 className="font-editorial text-3xl sm:text-4xl text-ink">{title}</h2>
                    {summary && <p className="text-ink-muted italic font-serif text-base">"{summary}"</p>}

                    {tagsStr && (
                      <div className="flex flex-wrap gap-1.5 pt-2">
                        {tagsStr.split(',').map((t, idx) => (
                          <span key={idx} className="px-2 py-0.5 rounded bg-emeraldAccent-dim text-emeraldAccent font-mono-tag text-[10px] font-semibold">
                            #{t.trim()}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  {coverImage && (
                    <img src={coverImage} alt={title} className="w-full h-48 sm:h-64 object-cover rounded border border-ivory-border shadow-xs" />
                  )}

                  {(attachedDocName || wordDocUrl) && (
