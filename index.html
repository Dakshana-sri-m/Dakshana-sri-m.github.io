                          >
                            <Icon name="book-open" className="w-4 h-4" />
                            <span>VIEW PAPER</span>
                          </button>
                          {editMode && (
                            <label className="cursor-pointer px-3 py-2 rounded bg-ink text-white font-mono-tag text-xs font-bold shadow hover:bg-emeraldAccent flex items-center gap-1.5 transition-colors">
                              <Icon name="image" className="w-3.5 h-3.5" />
                              <span>📷 UPLOAD PROOF PHOTO</span>
                              <input
                                type="file"
                                accept="image/*,.pdf"
                                className="hidden"
                                onChange={(e) => handleFileUpload(`achievements.research.${idx}.image`, e)}
                              />
                            </label>
                          )}
                        </div>
                      </div>

                      {r.image && (
                        <div className="lg:col-span-4">
                          <div
                            className="rounded overflow-hidden border border-ivory-border bg-white cursor-pointer group shadow-sm relative"
                            onClick={() => setLightboxImage({ src: r.image, alt: r.title, caption: `${r.title} · ${r.conference}` })}
                          >
                            <img src={r.image} alt={r.title} className="w-full h-56 object-cover object-top group-hover:scale-105 transition-transform duration-500" />
                            <div className="absolute inset-0 bg-ink/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                              <span className="px-3 py-1 bg-white/95 rounded text-xs font-mono-tag font-bold shadow text-emeraldAccent">
                                CLICK TO ENLARGE CERTIFICATE
                              </span>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ))}

                {/* 2. Merit Scholarship */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {data.achievements.scholarships.map((ach, aIdx) => (
                    <div key={ach.id || aIdx} className="p-7 paper-card rounded-sm space-y-4 group flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between font-mono-tag text-xs text-ink-dim mb-2">
                          <span className="text-emeraldAccent font-bold">{ach.category}</span>
                          <span>{ach.date}</span>
                        </div>

                        <h4 className="font-editorial text-2xl text-ink mb-1">
                          {ach.title}
                        </h4>

                        <p className="font-mono-tag text-xs text-ink-muted mb-3">
                          Awarded by: {ach.awardingBody} ({ach.period})
                        </p>

                        {ach.image && (
                          <div
                            className="mb-4 h-52 w-full rounded overflow-hidden border border-ivory-border cursor-pointer group-hover:shadow-md transition-all relative"
                            onClick={() => setLightboxImage({ src: ach.image, alt: ach.title, caption: `${ach.title} · ${ach.awardingBody}` })}
                          >
                            <img src={ach.image} alt={ach.title} className="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-500" />
                            <div className="absolute inset-0 bg-ink/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                              <span className="px-3 py-1 bg-white/95 rounded text-xs font-mono-tag font-bold shadow text-emeraldAccent">
                                CLICK TO ZOOM SCHOLARSHIP
                              </span>
                            </div>
                          </div>
                        )}

                        <p className="text-sm text-ink-muted font-light leading-relaxed">
                          {ach.recognition}
                        </p>
                      </div>

                      <div className="pt-3 border-t border-ivory-border flex flex-wrap items-center justify-between gap-2 font-mono-tag text-xs">
                        <div className="text-[11px] text-ink-dim">
                          <span>SIGNATORIES: {ach.signatories}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          {ach.image && (
                            <button
                              onClick={() => setLightboxImage({ src: ach.image, alt: ach.title, caption: `${ach.title} · ${ach.awardingBody}` })}
                              className="px-3 py-1 bg-emeraldAccent text-white rounded text-xs font-bold hover:bg-ink flex items-center gap-1 shadow-xs"
                            >
                              <Icon name="image" className="w-3.5 h-3.5" />
                              <span>VIEW CERTIFICATE</span>
                            </button>
                          )}
                          {editMode && (
                            <label className="cursor-pointer px-2.5 py-1 rounded bg-ink text-white font-mono-tag text-[11px] font-bold shadow hover:bg-emeraldAccent flex items-center gap-1">
                              <Icon name="image" className="w-3 h-3" />
                              <span>📷 UPLOAD PROOF</span>
                              <input
                                type="file"
                                accept="image/*,.pdf"
                                className="hidden"
                                onChange={(e) => handleFileUpload(`achievements.scholarships.${aIdx}.image`, e)}
                              />
                            </label>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

              </div>

            </div>
          </motion.section>

          {/* ========================================================================= */}
          {/* 9. CONTACT                                                                */}
          {/* ========================================================================= */}
          <motion.section
            id="contact"
            className="py-24 border-b border-ivory-border relative"
            initial={{ opacity: 0, y: 40 }}
            whileInView={{ opacity: 1, y: 0 }}
            viewport={{ once: true, margin: "-100px" }}
            transition={{ duration: 0.6 }}
          >
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">

                <div className="lg:col-span-6 space-y-8">
                  <div>
                    <div className="flex items-center justify-between font-mono-tag text-xs text-emeraldAccent mb-3 font-semibold">
                      <div className="flex items-center gap-3">
                        <span>09</span>
                        <span className="w-8 h-px bg-emeraldAccent/40"></span>
                        <span>TRANSMIT DISPATCH</span>
                      </div>
                      {renderSectionTile('tile_voice_2')}
                    </div>
                    <h2 className="font-editorial text-4xl sm:text-6xl text-ink leading-tight">
                      {data.contact.headline}
                    </h2>
                    <p className="mt-4 text-ink-muted text-base sm:text-lg font-light max-w-lg leading-relaxed">
                      {data.contact.subheadline}
                    </p>
                  </div>

                  <div className="p-6 paper-card rounded-sm space-y-4">
                    <div className="font-mono-tag text-xs text-emeraldAccent uppercase tracking-wider font-bold">
                      DIRECT INQUIRIES & CONTACT
                    </div>

                    {/* Email Card */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 bg-ivory-light border border-ivory-border rounded gap-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded bg-white border border-ivory-border flex items-center justify-center text-emeraldAccent">
                          <Icon name="mail" className="w-4 h-4" />
                        </div>
                        <div>
                          <span className="text-[10px] font-mono-tag text-ink-dim block">EMAIL ADDRESS</span>
                          <a href={`mailto:${data.meta.socials.email}`} className="font-mono-tag text-xs text-ink font-semibold hover:text-emeraldAccent">
                            {data.meta.socials.email}
                          </a>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(data.meta.socials.email);
                            showToast("Email copied to clipboard!", "success");
                          }}
                          className="px-3 py-1 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded hover:bg-ink shadow-xs"
                        >
                          COPY
                        </button>
                        <a
                          href={`mailto:${data.meta.socials.email}`}
                          className="px-3 py-1 bg-white border border-ivory-border text-ink hover:border-emeraldAccent font-mono-tag text-xs font-semibold rounded shadow-xs"
                        >
                          SEND MAIL
                        </a>
                      </div>
                    </div>

                    {/* Phone Card */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 bg-ivory-light border border-ivory-border rounded gap-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded bg-white border border-ivory-border flex items-center justify-center text-emeraldAccent">
                          <Icon name="phone" className="w-4 h-4" />
                        </div>
                        <div>
                          <span className="text-[10px] font-mono-tag text-ink-dim block font-semibold">PHONE / DIRECT CONTACT</span>
                          <a
                            href={`tel:${data.meta?.socials?.phone || '8870042836'}`}
                            className="font-mono-tag text-sm text-ink font-bold hover:text-emeraldAccent tracking-wide"
                          >
                            {data.meta?.socials?.phone || '8870042836'}
                          </a>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            const p = data.meta?.socials?.phone || '8870042836';
                            navigator.clipboard.writeText(p);
                            showToast("Phone number 8870042836 copied to clipboard!", "success");
                          }}
                          className="px-3.5 py-1.5 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded hover:bg-ink shadow-xs transition-colors"
                        >
                          COPY
                        </button>
                        <a
                          href={`tel:${data.meta?.socials?.phone || '8870042836'}`}
                          className="px-3.5 py-1.5 bg-white border border-ivory-border text-ink hover:border-emeraldAccent font-mono-tag text-xs font-semibold rounded shadow-xs transition-colors"
                        >
                          CALL NOW
                        </a>
                      </div>
                    </div>

                    {/* Resume / CV Card */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 bg-ivory-light border border-ivory-border rounded gap-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded bg-white border border-ivory-border flex items-center justify-center text-emeraldAccent">
                          <Icon name="file-text" className="w-4 h-4" />
                        </div>
                        <div>
                          <span className="text-[10px] font-mono-tag text-ink-dim block font-semibold">CURRICULUM VITAE</span>
                          <span className="font-mono-tag text-xs text-ink font-bold">
                            Dakshana_Sri_M_Resume.pdf
                          </span>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            const resume = data.meta?.resumeUrl || "assets/resume/dakshana_sri_m_resume.pdf";
                            setLightboxImage({
                              src: resume,
                              alt: "Dakshana Sri M — Curriculum Vitae & Resume",
                              caption: "Dakshana Sri M · Data Science, Prototyping, Research & Leadership Resume"
                            });
                          }}
                          className="px-3.5 py-1.5 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded hover:bg-ink shadow-xs transition-colors flex items-center gap-1"
                        >
                          <Icon name="file-text" className="w-3.5 h-3.5" />
                          <span>VIEW RESUME</span>
                        </button>
                        {editMode && (
                          <label className="cursor-pointer px-3.5 py-1.5 bg-white border border-ivory-border text-ink hover:border-emeraldAccent font-mono-tag text-xs font-semibold rounded shadow-xs transition-colors flex items-center gap-1">
                            <Icon name="upload" className="w-3.5 h-3.5 text-emeraldAccent" />
                            <span>UPLOAD</span>
                            <input
                              type="file"
                              accept=".pdf,image/*"
                              className="hidden"
                              onChange={(e) => handleFileUpload('meta.resumeUrl', e)}
                            />
                          </label>
                        )}
                      </div>
                    </div>

                    <p className="font-mono-tag text-xs text-ink-muted pt-2 border-t border-ivory-border/60">
                      📍 {data.contact.city} · {data.contact.availability}
                    </p>
                  </div>

                  <div className="space-y-3">
                    <span className="font-mono-tag text-xs text-ink-dim uppercase block font-bold">PROFESSIONAL NETWORK & CODE</span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 font-mono-tag text-xs">
                      <a
                        href={data.meta.socials.linkedin}
                        target="_blank"
                        rel="noreferrer"
                        className="p-4 bg-white border border-ivory-border hover:border-emeraldAccent text-ink rounded-sm flex items-center justify-between group transition-all shadow-xs"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded bg-ivory-light border border-ivory-border flex items-center justify-center text-emeraldAccent group-hover:bg-emeraldAccent group-hover:text-white transition-colors">
                            <Icon name="linkedin" className="w-4 h-4" />
                          </div>
                          <div>
                            <span className="font-bold block">LINKEDIN</span>
                            <span className="text-[10px] text-ink-muted">Professional Profile</span>
                          </div>
                        </div>
                        <Icon name="arrow-up-right" className="w-4 h-4 text-emeraldAccent group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
                      </a>

                      <a
                        href={data.meta.socials.github}
                        target="_blank"
                        rel="noreferrer"
                        className="p-4 bg-white border border-ivory-border hover:border-emeraldAccent text-ink rounded-sm flex items-center justify-between group transition-all shadow-xs"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded bg-ivory-light border border-ivory-border flex items-center justify-center text-emeraldAccent group-hover:bg-emeraldAccent group-hover:text-white transition-colors">
                            <Icon name="github" className="w-4 h-4" />
                          </div>
                          <div>
                            <span className="font-bold block">GITHUB</span>
                            <span className="text-[10px] text-ink-muted">Code & Repositories</span>
                          </div>
                        </div>
                        <Icon name="arrow-up-right" className="w-4 h-4 text-emeraldAccent group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
                      </a>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-6">
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      showToast("Inquiry transmitted successfully! Dakshana will respond shortly.", "success");
                      e.target.reset();
                    }}
                    className="p-8 sm:p-10 paper-card rounded-sm space-y-6 shadow-md"
                  >
                    <h3 className="font-editorial text-2xl text-ink mb-2">
                      Send a Message or Opportunity
                    </h3>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">YOUR NAME</label>
                      <input
                        type="text"
                        required
                        placeholder="Dr. Alex Rivera / Maya Patel"
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">EMAIL ADDRESS</label>
                      <input
                        type="email"
                        required
                        placeholder="alex@enterprise.org"
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">SUBJECT / TOPIC</label>
                      <input
                        type="text"
                        required
                        placeholder="Research Collaboration / Venture Discussion"
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">MESSAGE</label>
                      <textarea
                        rows={4}
                        required
                        placeholder="Share your thoughts, opportunity, or problem space..."
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 bg-ink text-ivory font-mono-tag text-xs font-bold uppercase tracking-wider rounded-sm hover:bg-emeraldAccent transition-all shadow-md flex items-center justify-center gap-2"
                    >
                      <span>TRANSMIT MESSAGE</span>
                      <Icon name="send" className="w-4 h-4" />
                    </button>
                  </form>
                </div>

              </div>

            </div>
          </motion.section>

          {/* ========================================================================= */}
          {/* COMPACT MINIMAL FOOTER                                                    */}
          {/* ========================================================================= */}
          <footer className="py-12 border-t border-ivory-border bg-ivory text-ink-dim font-mono-tag text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-ink font-semibold">{data.meta.name}</span> ·
                <span className="text-emeraldAccent ml-1 font-medium">STUDENT → BUILDER → LEADER</span>
              </div>
              <div className="text-center sm:text-right text-[11px]">
                <span>© {new Date().getFullYear()} DAKSHANA SRI M · STILL BUILDING.</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>

</html>
