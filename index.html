              <div className="glass-panel w-full max-w-4xl max-h-[90vh] rounded-3xl border border-cyan-500/40 shadow-2xl flex flex-col overflow-hidden">
                
                {/* Modal Header */}
                <div className="p-4 sm:p-5 border-b border-white/10 flex items-center justify-between bg-obsidian-900/90">
                  <div className="space-y-0.5">
                    <h3 className="font-bold text-sm sm:text-base text-white flex items-center gap-2">
                      <i data-lucide="shield-check" className="w-4 h-4 text-cyan-400"></i> {modalMedia.title}
                    </h3>
                    <p className="text-xs font-mono text-cyan-300 truncate max-w-md">
                      {modalMedia.issuer} • {modalMedia.code}
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <a
                      href={modalMedia.url}
                      download
                      className="p-2 rounded-xl bg-obsidian-800 hover:bg-obsidian-700 text-slate-200 border border-white/10 text-xs flex items-center gap-1 transition"
                      title="Download Artifact"
                    >
                      <i data-lucide="download" className="w-4 h-4"></i>
                    </a>
                    <button
                      onClick={() => setModalMedia(null)}
                      className="p-2 rounded-xl bg-obsidian-800 hover:bg-red-950/50 hover:text-red-300 text-slate-200 border border-white/10 transition"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>
                </div>

                {/* Modal Body / Viewer */}
                <div className="flex-1 overflow-y-auto p-4 sm:p-6 bg-obsidian-950/60 flex items-center justify-center min-h-[400px]">
                  {modalMedia.type === 'pdf' ? (
                    <iframe 
                      src={modalMedia.url} 
                      className="w-full h-[60vh] rounded-xl border border-white/10 bg-white"
                      title={modalMedia.title}
                    ></iframe>
                  ) : modalMedia.type === 'image' ? (
                    <div className="max-w-2xl max-h-[60vh] overflow-hidden rounded-xl border border-white/10 bg-obsidian-900 p-2">
                      <img 
                        src={modalMedia.url} 
                        alt={modalMedia.title}
                        className="w-full h-full object-contain rounded-lg"
                      />
                    </div>
                  ) : (
                    <div className="p-8 text-center space-y-4 max-w-md">
                      <i data-lucide="file-text" className="w-12 h-12 text-cyan-400 mx-auto"></i>
                      <h4 className="font-bold text-white">{modalMedia.title}</h4>
                      <p className="text-xs text-slate-400">Document formatted as retrospective report / external case study.</p>
                      <a 
                        href={modalMedia.url} 
                        download
                        className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-cyan-500 text-obsidian-950 font-bold text-xs"
                      >
                        <i data-lucide="download" className="w-4 h-4"></i> Download {modalMedia.url}
                      </a>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                <div className="p-3 bg-obsidian-900 border-t border-white/10 flex items-center justify-between text-xs font-mono text-slate-400">
                  <span>Cryptographic / Academic Verification Stamp</span>
                  <button 
                    onClick={() => setModalMedia(null)}
                    className="px-4 py-1.5 rounded-lg bg-obsidian-800 text-slate-200 hover:bg-obsidian-700 transition"
                  >
                    Close Viewer
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ADD BLOG MODAL */}
          {isAddBlogModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian-950/85 backdrop-blur-xl animate-fade-in">
              <div className="glass-panel w-full max-w-lg rounded-3xl border border-emerald-500/40 shadow-2xl p-6 space-y-5">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-bold text-base text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" className="w-4 h-4 text-emerald-400"></i> Attach Retrospective Blog (Week {selectedWeek})
                  </h3>
                  <button onClick={() => setIsAddBlogModalOpen(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddBlog} className="space-y-3.5">
                  <div className="space-y-1">
                    <label className="text-xs font-mono text-slate-300">Blog / Article Title *</label>
                    <input 
                      type="text" 
                      required 
                      value={newBlog.title}
                      onChange={(e) => setNewBlog({ ...newBlog, title: e.target.value })}
                      placeholder="e.g. Iteration Reflections: Sensor Filtering"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-white/10 text-slate-100 text-xs focus:outline-none focus:border-emerald-400"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-mono text-slate-300">File Name or External URL *</label>
                    <input 
                      type="text" 
                      required 
                      value={newBlog.url}
                      onChange={(e) => setNewBlog({ ...newBlog, url: e.target.value })}
                      placeholder="e.g. blog-week-01.docx or https://medium.com/..."
                      className="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-white/10 text-slate-100 text-xs focus:outline-none focus:border-emerald-400"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-xs font-mono text-slate-300">Format</label>
                      <select 
                        value={newBlog.type}
                        onChange={(e) => setNewBlog({ ...newBlog, type: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-white/10 text-slate-100 text-xs focus:outline-none focus:border-emerald-400"
                      >
                        <option value="doc">Document (.docx)</option>
                        <option value="pdf">PDF Document</option>
                        <option value="web">Web Article</option>
                      </select>
                    </div>

                    <div className="space-y-1">
                      <label className="text-xs font-mono text-slate-300">Target Sprint</label>
                      <input 
                        type="text" 
                        disabled 
                        value={`Week ${selectedWeek}`}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-950 border border-white/5 text-slate-400 text-xs font-mono"
                      />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-mono text-slate-300">Summary / Excerpt</label>
                    <textarea 
                      rows="2"
                      value={newBlog.desc}
                      onChange={(e) => setNewBlog({ ...newBlog, desc: e.target.value })}
                      placeholder="Brief description of retrospective takeaways..."
                      className="w-full px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-white/10 text-slate-100 text-xs focus:outline-none focus:border-emerald-400"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAddBlogModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-obsidian-800 text-slate-300 text-xs hover:bg-obsidian-700 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-obsidian-950 font-bold text-xs transition flex items-center gap-1.5"
                    >
                      <i data-lucide="check" className="w-3.5 h-3.5"></i> Save to Week {selectedWeek}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
