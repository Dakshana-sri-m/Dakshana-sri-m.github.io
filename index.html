                    <div className="p-3 bg-white border border-emeraldAccent/30 rounded flex items-center gap-2 font-mono-tag text-xs text-emeraldAccent">
                      <Icon name="file-word" className="w-4 h-4" />
                      <span>Attached Word Document: <strong>{attachedDocName || wordDocUrl}</strong></span>
                    </div>
                  )}

                  {highlightsText && (
                    <div className="p-4 bg-emeraldAccent-dim/40 border-l-4 border-emeraldAccent rounded-r-sm space-y-2">
                      <span className="font-mono-tag text-xs text-emeraldAccent font-bold uppercase block">KEY HIGHLIGHTS</span>
                      <ul className="space-y-1 text-xs">
                        {highlightsText.split('\n').filter(Boolean).map((h, i) => (
                          <li key={i} className="flex items-center gap-2 text-ink">
                            <span className="text-emeraldAccent font-bold">✓</span> {h}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  <div className="prose text-xs sm:text-sm text-ink leading-relaxed font-sans whitespace-pre-line">
                    {content}
                  </div>
                </div>
              )}

            </div>

            {/* Actions */}
            <div className="flex items-center justify-between px-6 sm:px-10 py-4 border-t border-ivory-border bg-ivory-light">
              {weeks[selectedWeekIdx]?.blog?.title && onDelete ? (
                <button
                  onClick={() => {
                    if (confirm(`Are you sure you want to delete the blog for Week ${selectedWeekIdx}?`)) {
                      onDelete(selectedWeekIdx);
                      onClose();
                    }
                  }}
                  className="px-4 py-2 bg-white border border-red-200 text-red-600 hover:bg-red-50 font-mono-tag text-xs rounded flex items-center gap-1.5 transition-colors"
                >
                  <Icon name="trash-2" className="w-3.5 h-3.5" />
                  <span>DELETE BLOG</span>
                </button>
              ) : <div />}

              <div className="flex items-center gap-3">
                <button
                  onClick={onClose}
                  className="px-4 py-2 bg-white border border-ivory-border text-ink-muted hover:text-ink font-mono-tag text-xs rounded transition-colors"
                >
                  CANCEL
                </button>
                <button
                  onClick={handleSave}
                  className="px-5 py-2.5 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded shadow-md hover:bg-ink flex items-center gap-2 transition-all"
                >
                  <Icon name="check" className="w-4 h-4" />
                  <span>SAVE & PUBLISH BLOG</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    /* ========================================================================= */
    /* TILES OF ME: INTERACTIVE BACKGROUND MATCHING GAME COMPONENTS              */
    /* ========================================================================= */

    function TilesOfMeCard({
      tile,
      pair,
      isFlipped,
      isMatched,
      onFlip,
      editMode,
      onOpenSettings
    }) {
      if (!pair) return null;
      const hasImage = !!pair.image;

      const handleClick = (e) => {
        e.stopPropagation();
        onFlip(tile.id);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onFlip(tile.id);
        }
      };

      return (
        <div
          className={`tile-perspective select-none relative inline-block transition-transform duration-300 ${isMatched ? 'tile-found-pop' : 'hover:-translate-y-1'}`}
          style={{ width: '132px', height: '116px' }}
          role="button"
          tabIndex={0}
          aria-label={`Tiles of Me interactive piece: ${isFlipped || isMatched ? pair.name + ' - ' + pair.meaning : 'Hidden identity tile. Click to flip.'}`}
          aria-pressed={isFlipped || isMatched}
          onClick={handleClick}
          onKeyDown={handleKeyDown}
        >
          <div className={`tile-card-inner cursor-pointer rounded-lg transition-all ${isFlipped || isMatched ? 'is-flipped' : ''}`}>

            {/* FRONT FACE (Unrevealed) */}
            <div className="tile-card-front bg-white/95 backdrop-blur-md border border-ivory-darkBorder hover:border-emeraldAccent shadow-sm hover:shadow-md flex flex-col items-center justify-between p-2.5 transition-all group">
              <div className="w-full flex items-center justify-between font-mono-tag text-[8.5px] text-ink-dim">
                <span className="flex items-center gap-1 text-emeraldAccent font-semibold">
                  <span className="w-1.5 h-1.5 rounded-full bg-emeraldAccent animate-pulse"></span>
                  TILES OF ME
                </span>
                <span className="text-[7.5px] text-ink-dim/80 uppercase">#{tile.instance}</span>
              </div>

              <div className="w-9 h-9 rounded-full bg-ivory-light border border-ivory-border flex items-center justify-center text-ink-muted group-hover:text-emeraldAccent group-hover:scale-110 group-hover:border-emeraldAccent transition-all shadow-2xs">
                <span className="font-editorial text-xl font-bold">?</span>
              </div>

              <div className="w-full flex items-center justify-center">
                <span className="font-mono-tag text-[7.5px] text-ink-dim uppercase tracking-wider group-hover:text-emeraldAccent transition-colors">
                  CLICK TO REVEAL
                </span>
              </div>
            </div>

            {/* BACK FACE (Revealed / Matched) */}
            <div className={`tile-card-back flex flex-col justify-between p-2.5 text-left relative ${isMatched
              ? 'bg-white border-2 border-emeraldAccent tile-matched-glow shadow-md'
              : 'bg-white border-2 border-emeraldAccent/40 shadow-sm'
              }`}>
              {hasImage ? (
                <div className="absolute inset-0 z-0 overflow-hidden rounded-md">
                  <img src={pair.image} alt={pair.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-ink/95 via-ink/50 to-black/20"></div>
                </div>
              ) : null}

              <div className={`relative z-10 flex items-center justify-between font-mono-tag text-[8px] ${hasImage ? 'text-white' : 'text-emeraldAccent'}`}>
                <span className="px-1.5 py-0.5 rounded bg-emeraldAccent/15 backdrop-blur-xs font-bold uppercase truncate max-w-[75px]">
                  {pair.category || "IDENTITY"}
                </span>
                {isMatched ? (
                  <span className="px-1.5 py-0.5 rounded bg-emeraldAccent text-white font-bold flex items-center gap-0.5 text-[8px] shadow-xs">
                    <Icon name="check" className="w-2.5 h-2.5" />
                    <span>FOUND</span>
                  </span>
                ) : (
                  <span className="text-[7.5px] opacity-80 uppercase tracking-wide">REVEALED</span>
                )}
              </div>

              <div className="relative z-10 my-auto flex items-center gap-2 py-1">
                <div className={`w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 ${hasImage
                  ? 'bg-white/20 text-white backdrop-blur-xs'
                  : 'bg-emeraldAccent-dim text-emeraldAccent border border-emeraldAccent/20'
                  }`}>
                  <Icon name={pair.symbol || 'sparkles'} className="w-3.5 h-3.5" />
                </div>
                <div className="min-w-0">
                  <h5 className={`font-mono-tag text-[10px] font-bold leading-tight uppercase truncate ${hasImage ? 'text-white' : 'text-ink'}`}>
                    {pair.name}
                  </h5>
                  <p className={`font-mono-tag text-[7.5px] truncate ${hasImage ? 'text-ivory-light' : 'text-ink-dim'}`}>
                    {pair.meaning ? pair.meaning.slice(0, 32) + '...' : ''}
                  </p>
                </div>
              </div>

              <div className={`relative z-10 flex items-center justify-between font-mono-tag text-[7.5px] border-t pt-1 ${hasImage ? 'border-white/20 text-ivory-light' : 'border-ivory-border text-ink-muted'
                }`}>
                <span className="truncate">{isMatched ? '✓ Connection locked' : 'Find pair tile'}</span>
                {editMode && (
                  <button
                    type="button"
                    onClick={(ev) => {
                      ev.stopPropagation();
                      onOpenSettings();
                    }}
                    className="text-emeraldAccent hover:underline font-bold"
                  >
                    EDIT
                  </button>
                )}
              </div>

            </div>

          </div>
        </div>
      );
    }

    function TilesOfMeIndicator({
      gameState,
      pairs,
      onReset,
      onOpenSettings,
      editMode
    }) {
      const [isOpen, setIsOpen] = useState(false);
      const enabledPairs = (pairs || []).filter(p => p.enabled !== false);
      const totalPairs = enabledPairs.length;
      const foundCount = (gameState?.matchedPairIds || []).length;
      const isAllFound = foundCount >= totalPairs && totalPairs > 0;

      return (
        <div className="fixed bottom-6 left-6 z-40 font-mono-tag">

          {/* Main Floating Pill */}
          <div className="relative">
            <button
              onClick={() => setIsOpen(!isOpen)}
              className={`flex items-center gap-3 px-3.5 py-2 rounded-full border shadow-lg backdrop-blur-xl transition-all ${isAllFound
                ? 'bg-emeraldAccent text-white border-emeraldAccent shadow-emeraldAccent/30'
                : 'bg-white/95 text-ink border-ivory-darkBorder hover:border-emeraldAccent'
                }`}
              title="Click to view Tiles of Me game progress"
              aria-label="Tiles of Me game status"
            >
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${isAllFound ? 'bg-white animate-ping' : 'bg-emeraldAccent animate-pulse'}`}></span>
                <span className="text-[11px] font-bold uppercase tracking-wider">
                  TILES OF ME
                </span>
              </div>

              <div className="flex items-center gap-1">
                {enabledPairs.map((p, idx) => {
                  const isFound = (gameState?.matchedPairIds || []).includes(p.id);
                  return (
                    <span
                      key={p.id || idx}
                      className={`w-2 h-2 rounded-full transition-all ${isFound
                        ? (isAllFound ? 'bg-white scale-110' : 'bg-emeraldAccent scale-110 shadow-xs')
                        : (isAllFound ? 'bg-white/40' : 'bg-ivory-border')
                        }`}
                      title={`${p.name}: ${isFound ? 'Found' : 'Hidden'}`}
                    />
                  );
                })}
              </div>

              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${isAllFound ? 'bg-white/20 text-white' : 'bg-ivory-light text-emeraldAccent'
                }`}>
                {foundCount}/{totalPairs}
              </span>
            </button>

            {/* Popover Progress Drawer */}
            {isOpen && (
              <div className="absolute bottom-12 left-0 w-80 sm:w-96 bg-white border border-ivory-border rounded-lg shadow-2xl p-5 space-y-4 animate-in fade-in slide-in-from-bottom-2 duration-200">
                <div className="flex items-start justify-between border-b border-ivory-border pb-3">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-emeraldAccent animate-pulse"></span>
                      <h4 className="font-editorial text-xl text-ink font-bold">TILES OF ME</h4>
                    </div>
                    <p className="text-[11px] text-ink-muted mt-0.5">
                      Find all {totalPairs} matching pairs hidden throughout my portfolio.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsOpen(false)}
                    className="p-1 rounded text-ink-muted hover:text-ink hover:bg-ivory-light transition-colors"
                    aria-label="Close panel"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {/* Progress Bar */}
                <div className="space-y-1">
                  <div className="flex items-center justify-between text-[10px] text-ink-dim">
                    <span>DISCOVERY PROGRESS</span>
                    <span className="text-emeraldAccent font-bold">{Math.round((foundCount / (totalPairs || 1)) * 100)}% COMPLETE</span>
                  </div>
                  <div className="w-full h-1.5 bg-ivory-muted rounded-full overflow-hidden">
                    <div
                      className="h-full bg-emeraldAccent transition-all duration-500 rounded-full"
                      style={{ width: `${(foundCount / (totalPairs || 1)) * 100}%` }}
                    />
                  </div>
                </div>

                {/* List of Pairs */}
                <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                  {enabledPairs.map((p) => {
                    const isFound = (gameState?.matchedPairIds || []).includes(p.id);
                    return (
                      <div
                        key={p.id}
                        className={`p-2.5 rounded border transition-all flex items-center justify-between gap-3 ${isFound
                          ? 'bg-emeraldAccent-dim/30 border-emeraldAccent/30'
                          : 'bg-ivory-light/60 border-ivory-border opacity-70'
                          }`}
                      >
                        <div className="flex items-center gap-2.5 min-w-0">
                          <div className={`w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 ${isFound ? 'bg-emeraldAccent text-white shadow-xs' : 'bg-white border border-ivory-border text-ink-dim'
                            }`}>
                            <Icon name={p.symbol || 'sparkles'} className="w-3.5 h-3.5" />
                          </div>
                          <div className="min-w-0">
                            <span className="font-bold text-[11px] text-ink block truncate">
                              {p.name}
                            </span>
                            <span className="text-[9.5px] text-ink-muted block truncate">
                              {isFound ? (p.meaning || p.category) : "Hidden in section margins..."}
                            </span>
                          </div>
                        </div>

                        <div>
                          {isFound ? (
                            <span className="px-2 py-0.5 rounded bg-emeraldAccent text-white font-bold text-[9px] flex items-center gap-1">
                              <Icon name="check" className="w-2.5 h-2.5" />
                              <span>FOUND</span>
                            </span>
                          ) : (
                            <span className="text-[9px] font-mono-tag text-ink-dim px-2 py-0.5 bg-white border border-ivory-border rounded">
                              MYSTERY
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Footer Action Buttons */}
                <div className="pt-2 border-t border-ivory-border flex items-center justify-between gap-2 text-[10px]">
                  <button
                    onClick={() => {
                      if (confirm("Reset game discovery? All tiles will be hidden again.")) {
                        onReset();
                        setIsOpen(false);
                      }
                    }}
                    className="text-ink-muted hover:text-red-600 flex items-center gap-1 transition-colors"
                  >
                    <Icon name="rotate-ccw" className="w-3 h-3" />
                    <span>RESET GAME</span>
                  </button>

                  {editMode && (
                    <button
                      onClick={() => {
                        setIsOpen(false);
                        onOpenSettings();
                      }}
                      className="text-emeraldAccent font-bold hover:underline flex items-center gap-1"
                    >
                      <Icon name="settings" className="w-3 h-3" />
                      <span>EDIT TILES</span>
                    </button>
                  )}
                </div>

              </div>
            )}
          </div>

        </div>
      );
    }

    function TilesOfMeCompletionModal({
      pairs,
      onClose,
      onReset
    }) {
      const enabledPairs = (pairs || []).filter(p => p.enabled !== false);

      return (
        <div className="fixed inset-0 z-50 bg-ink/80 backdrop-blur-md flex items-center justify-center p-4 sm:p-6 animate-in fade-in duration-300">
          <div className="w-full max-w-2xl bg-white rounded-lg border border-ivory-border shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

            <div className="p-6 sm:p-8 bg-paper-grain border-b border-ivory-border text-center space-y-3 relative">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emeraldAccent-dim border border-emeraldAccent/30 text-emeraldAccent font-mono-tag text-xs font-bold uppercase tracking-wider">
                <Icon name="sparkles" className="w-3.5 h-3.5" />
                <span>{enabledPairs.length} / {enabledPairs.length} PAIRS FOUND · DISCOVERY MOMENT</span>
              </div>

              <h2 className="font-editorial text-3xl sm:text-5xl text-ink leading-tight">
                YOU FOUND THE CONNECTIONS.
              </h2>

              <p className="font-editorial italic text-lg sm:text-xl text-emeraldAccent max-w-lg mx-auto">
                "Every tile represents a different part of my journey."
              </p>
            </div>

            <div className="p-6 sm:p-8 overflow-y-auto space-y-6">

              <div className="flex flex-wrap items-center justify-center gap-2 font-mono-tag text-xs font-bold text-emeraldAccent">
                {enabledPairs.map((p, idx) => (
                  <React.Fragment key={p.id || idx}>
                    <span className="px-3 py-1 bg-white border border-emeraldAccent/40 rounded-sm shadow-xs">
                      {p.name}
                    </span>
                    {idx < enabledPairs.length - 1 && (
                      <span className="text-ink-dim">→</span>
                    )}
                  </React.Fragment>
                ))}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2">
                {enabledPairs.map((pair) => (
                  <div key={pair.id} className="p-4 rounded border border-ivory-border bg-ivory-light/50 space-y-2 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between font-mono-tag text-[10px] text-ink-dim mb-1">
                        <span className="text-emeraldAccent font-bold uppercase">{pair.category || "IDENTITY"}</span>
                        <span className="text-emeraldAccent font-semibold">✓ CONNECTED</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="w-6 h-6 rounded-full bg-emeraldAccent-dim text-emeraldAccent flex items-center justify-center">
                          <Icon name={pair.symbol || 'sparkles'} className="w-3 h-3" />
                        </div>
                        <h4 className="font-mono-tag text-xs font-bold text-ink uppercase">{pair.name}</h4>
                      </div>
                      <p className="text-xs text-ink-muted font-light mt-2 leading-relaxed">
                        {pair.meaning}
                      </p>
                    </div>
                  </div>
                ))}
              </div>

            </div>

            <div className="p-5 sm:p-6 bg-ivory-light border-t border-ivory-border flex flex-col sm:flex-row items-center justify-between gap-3 font-mono-tag text-xs">
              <button
                onClick={onReset}
                className="text-ink-muted hover:text-ink flex items-center gap-1.5"
              >
                <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
                <span>PLAY AGAIN (RESET TILES)</span>
              </button>

              <button
                onClick={onClose}
                className="w-full sm:w-auto px-6 py-3 bg-emeraldAccent text-white font-bold rounded shadow hover:bg-ink transition-colors flex items-center justify-center gap-2"
              >
                <span>CONTINUE EXPLORING PORTFOLIO</span>
                <Icon name="arrow-right" className="w-4 h-4" />
              </button>
            </div>

          </div>
        </div>
      );
    }

    function TilesOfMeSettingsModal({
      tilesOfMe,
      onSave,
      onClose,
      onResetGameState
    }) {
      const [pairs, setPairs] = useState(tilesOfMe?.pairs || []);

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem("dakshana_portfolio_v2_data");
          if (saved) {

            parsed.meta = { ...DEFAULT_DATA.meta, ...parsed.meta };
            parsed.meta.socials = {
              ...DEFAULT_DATA.meta.socials,
              ...parsed.meta.socials,
              phone: "8870042836",
              email: "dakshanasrim1406@gmail.com",
              linkedin: "https://www.linkedin.com/in/dakshana-sri-m-aa0b9537b?utm_source=share_via&utm_content=profile&utm_medium=member_android",
              github: "https://github.com/Dakshana-sri-m"
            };
            parsed.contact = {
              ...DEFAULT_DATA.contact,
              ...parsed.contact,
              directEmail: "dakshanasrim1406@gmail.com",
              phone: "8870042836"
            };
            if (parsed.protosem && parsed.protosem.weeks) {
              parsed.protosem.weeks = parsed.protosem.weeks.map((w, idx) => {
                const defaultWeek = DEFAULT_DATA.protosem.weeks?.[idx];
                if (defaultWeek) {
                  if (idx === 0) {
                    return { ...defaultWeek, ...w, blog: defaultWeek.blog, days: defaultWeek.days };
                  }
                  if (idx === 1) {
                    return { ...defaultWeek, ...w, blog: null, days: defaultWeek.days };
                  }
                  if (defaultWeek.blog) {
                    if (!w.blog || !w.blog.content) {
                      return { ...w, blog: { ...defaultWeek.blog, ...w.blog } };
                    }
                  }
                }
                return w;
              });
            }
            if (!parsed.tilesOfMe) {
              parsed.tilesOfMe = DEFAULT_DATA.tilesOfMe;
            } else if (!parsed.tilesOfMe.pairs || parsed.tilesOfMe.pairs.length === 0) {
              parsed.tilesOfMe.pairs = DEFAULT_DATA.tilesOfMe.pairs;
            }
            return parsed;
          }
        } catch (e) {
          console.warn("Storage read error:", e);
        }
        return DEFAULT_DATA;
      });

      const [editMode, setEditMode] = useState(false);
      const [activeSection, setActiveSection] = useState("home");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [activeWeekIndex, setActiveWeekIndex] = useState(0);
      const [activeDayIndex, setActiveDayIndex] = useState(0);
      const [lightboxImage, setLightboxImage] = useState(null);
      const [selectedSkill, setSelectedSkill] = useState(null);
      const [history, setHistory] = useState([]);

      // ProtoSem Blog States
      const [readingBlogWeekIdx, setReadingBlogWeekIdx] = useState(null);
      const [editingBlogWeekIdx, setEditingBlogWeekIdx] = useState(null);
      const [isNewBlogModal, setIsNewBlogModal] = useState(false);
      const [blogSearchQuery, setBlogSearchQuery] = useState("");
      const [selectedBlogTag, setSelectedBlogTag] = useState("ALL");

      // Tiles of Me Persistent Game States
      const [gameState, setGameState] = useState(() => {
        try {
          const saved = localStorage.getItem("dakshana_tiles_of_me_state_v1");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === 'object') {
              return {
                matchedPairIds: Array.isArray(parsed.matchedPairIds) ? parsed.matchedPairIds : [],
                flippedTileIds: Array.isArray(parsed.flippedTileIds) ? parsed.flippedTileIds : [],
                moves: typeof parsed.moves === 'number' ? parsed.moves : 0,
                isCompleteModalDismissed: !!parsed.isCompleteModalDismissed
              };
            }
          }
        } catch (e) {
          console.warn("Tiles game state read error:", e);
        }
        return {
          matchedPairIds: [],
          flippedTileIds: [],
          moves: 0,
          isCompleteModalDismissed: false
        };
      });
      const [isFlippingLock, setIsFlippingLock] = useState(false);
      const [openTilesSettings, setOpenTilesSettings] = useState(false);

      const handleTileFlip = (tileId) => {
        if (isFlippingLock) return;

        const pairs = data.tilesOfMe?.pairs || DEFAULT_DATA.tilesOfMe.pairs;
        const enabledPairs = pairs.filter(p => p.enabled !== false);
        const allTileInstances = [];
        enabledPairs.forEach(pair => {
          allTileInstances.push({ id: `tile_${pair.id}_1`, pairId: pair.id, instance: 1 });
          allTileInstances.push({ id: `tile_${pair.id}_2`, pairId: pair.id, instance: 2 });
        });

        const targetTile = allTileInstances.find(t => t.id === tileId);
        if (!targetTile) return;

        // Already matched or flipped
        if (gameState.matchedPairIds.includes(targetTile.pairId)) return;
        if (gameState.flippedTileIds.includes(tileId)) return;

        const currentFlipped = [...gameState.flippedTileIds, tileId];

        if (currentFlipped.length === 1) {
          const nextState = { ...gameState, flippedTileIds: currentFlipped, moves: (gameState.moves || 0) + 1 };
          setGameState(nextState);
          try { localStorage.setItem("dakshana_tiles_of_me_state_v1", JSON.stringify(nextState)); } catch (e) { }
        } else if (currentFlipped.length === 2) {
          const firstTile = allTileInstances.find(t => t.id === currentFlipped[0]);
          const secondTile = allTileInstances.find(t => t.id === currentFlipped[1]);

          if (firstTile && secondTile && firstTile.pairId === secondTile.pairId) {
            // MATCH FOUND!
            const nextMatched = [...gameState.matchedPairIds, firstTile.pairId];
            const isComplete = nextMatched.length >= enabledPairs.length;
            const nextState = {
              ...gameState,
              matchedPairIds: nextMatched,
              flippedTileIds: [],
              moves: (gameState.moves || 0) + 1,
              isCompleteModalDismissed: isComplete ? false : gameState.isCompleteModalDismissed
            };
            setGameState(nextState);
            try { localStorage.setItem("dakshana_tiles_of_me_state_v1", JSON.stringify(nextState)); } catch (e) { }

            const pairName = enabledPairs.find(p => p.id === firstTile.pairId)?.name || "IDENTITY PIECE";
            showToast(`✨ MATCH FOUND! [ ${pairName} ] connected (${nextMatched.length}/${enabledPairs.length})`, "success");
          } else {
            // MISMATCH: Show both for 700ms, then flip back smoothly
            const tempState = { ...gameState, flippedTileIds: currentFlipped, moves: (gameState.moves || 0) + 1 };
            setGameState(tempState);
            setIsFlippingLock(true);
            setTimeout(() => {
              setGameState(prev => {
                const revertState = { ...prev, flippedTileIds: [] };
                try { localStorage.setItem("dakshana_tiles_of_me_state_v1", JSON.stringify(revertState)); } catch (e) { }
                return revertState;
              });
              setIsFlippingLock(false);
            }, 700);
          }
        }
      };

      const handleResetTilesGame = () => {
        const freshState = {
          matchedPairIds: [],
          flippedTileIds: [],
          moves: 0,
          isCompleteModalDismissed: false
        };
        setGameState(freshState);
        try { localStorage.setItem("dakshana_tiles_of_me_state_v1", JSON.stringify(freshState)); } catch (e) { }
        showToast("Tiles of Me game reset. Explore the portfolio to discover all connections again!", "info");
      };

      const handleSaveTilesSettings = (updatedTilesConfig) => {
        updateField("tilesOfMe", updatedTilesConfig);
        showToast("Tiles of Me settings saved successfully!", "success");
      };

      const renderSectionTile = (tileId, extraClasses = "") => {
        const pairs = data.tilesOfMe?.pairs || DEFAULT_DATA.tilesOfMe.pairs;
        const enabledPairs = pairs.filter(p => p.enabled !== false);
        const allTileInstances = [];
        enabledPairs.forEach(pair => {
          allTileInstances.push({ id: `tile_${pair.id}_1`, pairId: pair.id, instance: 1 });
          allTileInstances.push({ id: `tile_${pair.id}_2`, pairId: pair.id, instance: 2 });
        });

        const tile = allTileInstances.find(t => t.id === tileId);
        if (!tile) return null;
        const pair = enabledPairs.find(p => p.id === tile.pairId);
        if (!pair) return null;

        const isFlipped = (gameState.flippedTileIds || []).includes(tile.id);
        const isMatched = (gameState.matchedPairIds || []).includes(tile.pairId);

        return (
          <div className={`tile-anchor-wrapper ${extraClasses}`}>
            <TilesOfMeCard
              tile={tile}
              pair={pair}
              isFlipped={isFlipped}
              isMatched={isMatched}
              onFlip={handleTileFlip}
              editMode={editMode}
              onOpenSettings={() => setOpenTilesSettings(true)}
            />
          </div>
        );
      };

      const handleSaveBlog = (targetWeekIdx, updatedBlog) => {
        const currentWeeks = [...weeks];

          };

              introHeadline: `WEEK ${i} SPRINT`,

              blog: null,
              days: [1, 2, 3, 4, 5].map(d => ({
                dayNumber: d,
                title: `Day 0${d} — Sprint Execution`,
                theme: d === 1 ? 'DISCOVERY' : d === 2 ? 'ARCHITECTURE' : d === 3 ? 'BUILD' : d === 4 ? 'VALIDATION' : 'DEMO',

                reflection: { whatHappened: "", whatINoticed: "", whatIContributed: "", whatSurprisedMe: "", whatILearned: "", whatWouldIDoDifferently: "", howChangedThinking: "" },

          }
          currentWeeks[targetWeekIdx] = {
            weekNumber: targetWeekIdx,
            label: `W${targetWeekIdx < 10 ? '0' + targetWeekIdx : targetWeekIdx}`,
            title: `Week ${targetWeekIdx}: ${updatedBlog.title || 'Venture Prototyping'}`,
            status: "IN_PROGRESS",
            theme: "System Execution & Testing",
            introHeadline: `WEEK ${targetWeekIdx} SPRINTS`,
            introQuote: "Prototyping velocity and sprint deliverables.",
            introText: updatedBlog.summary || "Advancing through the 20-week venture sprint trajectory.",
            blog: updatedBlog,
            days: [1, 2, 3, 4, 5].map(d => ({
              dayNumber: d,
              title: `Day 0${d} — Sprint Execution`,
              theme: d === 1 ? 'DISCOVERY' : d === 2 ? 'ARCHITECTURE' : d === 3 ? 'BUILD' : d === 4 ? 'VALIDATION' : 'DEMO',
              summary: "Sprint objectives and tasks.",
              takeaway: "Key sprint insight.",
              reflection: { whatHappened: "", whatINoticed: "", whatIContributed: "", whatSurprisedMe: "", whatILearned: "", whatWouldIDoDifferently: "", howChangedThinking: "" },
              image: ""
            }))
          };
        }
        updateField("protosem.weeks", currentWeeks);
        setEditingBlogWeekIdx(null);
        setIsNewBlogModal(false);
        showToast(`Blog post for Week ${targetWeekIdx} saved successfully!`, "success");
      };

      const handleDeleteBlog = (targetWeekIdx) => {
        const currentWeeks = [...weeks];
        if (currentWeeks[targetWeekIdx]) {
          const updated = { ...currentWeeks[targetWeekIdx] };
          delete updated.blog;
          currentWeeks[targetWeekIdx] = updated;
          updateField("protosem.weeks", currentWeeks);
          showToast(`Removed blog from Week ${targetWeekIdx}.`, "info");
        }
      };

      const updateData = (updater) => {
        setData(prev => {
          const updated = typeof updater === 'function' ? updater(prev) : updater;
          setHistory(h => [...h.slice(-10), prev]);
          try {
            localStorage.setItem("dakshana_portfolio_v2_data", JSON.stringify(updated));
          } catch (e) {
            console.error("Storage write error:", e);
          }
          return updated;
        });
      };

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type, id: Date.now() });
        setTimeout(() => setToast(null), 3500);
      };

      const handleUndo = () => {
        if (history.length > 0) {
          const last = history[history.length - 1];
          setHistory(h => h.slice(0, -1));
          setData(last);
          localStorage.setItem("dakshana_portfolio_v2_data", JSON.stringify(last));
          showToast("Reverted to previous state", "info");
        } else {
          showToast("No further undo history", "info");
        }
      };

      const handleReset = () => {
        if (confirm("Reset to original content? All custom edits will be restored to defaults.")) {
          setData(DEFAULT_DATA);
          localStorage.removeItem("dakshana_portfolio_v2_data");
          showToast("Portfolio data restored to defaults", "info");
        }
      };

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `dakshana_portfolio_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("Exported JSON backup successfully", "success");
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            updateData(parsed);
            showToast("Custom portfolio data imported successfully!", "success");
          } catch (err) {
            showToast("Invalid JSON file", "error");
          }
        };
        reader.readAsText(file);
      };

      const handleFileUpload = (path, e, maxSizeMB = 15) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.size > maxSizeMB * 1024 * 1024) {
          showToast(`File is too large (maximum ${maxSizeMB}MB).`, "error");
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          updateField(path, event.target.result);
          showToast("Document / photo uploaded & saved locally!", "success");
        };
        reader.readAsDataURL(file);
      };

      const updateField = (path, val) => {
        updateData(prev => {
          const clone = JSON.parse(JSON.stringify(prev));
          const keys = path.split('.');
          let curr = clone;
          for (let i = 0; i < keys.length - 1; i++) {
            curr = curr[keys[i]];
          }
          curr[keys[keys.length - 1]] = val;
          return clone;
        });
      };

      // 9 Primary Sections Scroll Spy
      useEffect(() => {
        const handleScroll = () => {
          const sections = ['home', 'about', 'certificate', 'protosem', 'skill', 'project', 'build', 'achievements', 'contact'];
          const pos = window.scrollY + 200;
          for (const s of sections) {
            const el = document.getElementById(s);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (pos >= top && pos < top + height) {
                setActiveSection(s);
                break;
              }
            }
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const weeks = data.protosem?.weeks || [];
      const currentWeek = weeks[activeWeekIndex] || {
        weekNumber: activeWeekIndex,
        label: `W${activeWeekIndex < 10 ? '0' + activeWeekIndex : activeWeekIndex}`,
        title: `Week ${activeWeekIndex}: Venture Prototyping & Build Sprint`,
        status: "PLANNED",
        theme: "Ecosystem Synthesis & Systems Architecture",
        introHeadline: `WEEK ${activeWeekIndex} SPRINTS`,
        introQuote: "Continuous rapid prototyping and real customer feedback.",
        introText: "Advancing through the 20-week venture sprint trajectory toward working prototypes.",
        days: [1, 2, 3, 4, 5].map(d => ({
          dayNumber: d,
          title: `Day 0${d} — Sprint Execution`,
          theme: d === 1 ? 'DISCOVERY' : d === 2 ? 'ARCHITECTURE' : d === 3 ? 'BUILD' : d === 4 ? 'VALIDATION' : 'DEMO',
          summary: `Daily build goals and sprint execution for Week ${activeWeekIndex}.`,
          takeaway: "Iterative prototype validation.",
          reflection: { whatHappened: "", whatINoticed: "", whatIContributed: "", whatSurprisedMe: "", whatILearned: "", whatWouldIDoDifferently: "", howChangedThinking: "" },
          image: ""
        }))
      };
      const currentDay = currentWeek.days?.[activeDayIndex] || currentWeek.days?.[0] || {};

      const navItems = [
        { label: "HOME", href: "#home", id: "home" },
        { label: "ABOUT", href: "#about", id: "about" },
        { label: "CERTIFICATE", href: "#certificate", id: "certificate" },
        { label: "PROTOSEM", href: "#protosem", id: "protosem" },
        { label: "SKILL", href: "#skill", id: "skill" },
        { label: "PROJECT", href: "#project", id: "project" },
        { label: "BUILD", href: "#build", id: "build" },
        { label: "ACHIEVEMENTS", href: "#achievements", id: "achievements" },
        { label: "CONTACT", href: "#contact", id: "contact" }
      ];

      return (
        <div className="min-h-screen text-ink pb-24">

          <DynamicCursor />

          {lightboxImage && (
            <ImageLightbox
              src={lightboxImage.src}
              alt={lightboxImage.alt}
              caption={lightboxImage.caption}
              onClose={() => setLightboxImage(null)}
            />
          )}

          {readingBlogWeekIdx !== null && weeks[readingBlogWeekIdx]?.blog && (
            <ProtoSemBlogModal
              blog={weeks[readingBlogWeekIdx].blog}
              week={weeks[readingBlogWeekIdx]}
              weekIndex={readingBlogWeekIdx}
              totalWeeks={weeks.length}
              onClose={() => setReadingBlogWeekIdx(null)}
              onEdit={(wIdx) => setEditingBlogWeekIdx(wIdx)}
              canEdit={true}
              onNavigateWeek={(newIdx) => {
                if (weeks[newIdx] && weeks[newIdx].blog) {
                  setReadingBlogWeekIdx(newIdx);
                } else {
                  showToast(`Week ${newIdx} does not have a published blog yet.`, "info");
                }
              }}
            />
          )}

          {editingBlogWeekIdx !== null && (
            <ProtoSemBlogEditorModal
              weekIndex={editingBlogWeekIdx}
              isNew={isNewBlogModal}
              weeks={weeks}
              onClose={() => {
                setEditingBlogWeekIdx(null);
                setIsNewBlogModal(false);
              }}
              onSave={handleSaveBlog}
              onDelete={handleDeleteBlog}
            />
          )}

          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded bg-ink text-ivory shadow-xl text-xs font-mono-tag border border-ivory-darkBorder">
              <span className="w-2 h-2 rounded-full bg-emeraldAccent-light animate-pulse"></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* ========================================================================= */}
          {/* TILES OF ME: FLOATING PROGRESS INDICATOR & COMPLETION / SETTINGS MODALS   */}
          {/* ========================================================================= */}
          {data.tilesOfMe?.enabled !== false && (
            <TilesOfMeIndicator
              gameState={gameState}
              pairs={data.tilesOfMe?.pairs || DEFAULT_DATA.tilesOfMe.pairs}
              onReset={handleResetTilesGame}
              onOpenSettings={() => setOpenTilesSettings(true)}
              editMode={editMode}
            />
          )}

          {(gameState?.matchedPairIds || []).length >= ((data.tilesOfMe?.pairs || DEFAULT_DATA.tilesOfMe.pairs) || []).filter(p => p && p.enabled !== false).length &&
            ((data.tilesOfMe?.pairs || DEFAULT_DATA.tilesOfMe.pairs) || []).filter(p => p && p.enabled !== false).length > 0 &&
            !gameState?.isCompleteModalDismissed && (
              <TilesOfMeCompletionModal
                pairs={data.tilesOfMe?.pairs || DEFAULT_DATA.tilesOfMe.pairs}
                onClose={() => {
                  const dismissedState = { ...gameState, isCompleteModalDismissed: true };
                  setGameState(dismissedState);
                  try { localStorage.setItem("dakshana_tiles_of_me_state_v1", JSON.stringify(dismissedState)); } catch (e) { }
                }}
                onReset={handleResetTilesGame}
              />
            )}

          {openTilesSettings && (
            <TilesOfMeSettingsModal
              tilesOfMe={data.tilesOfMe || DEFAULT_DATA.tilesOfMe}
              onSave={handleSaveTilesSettings}
              onClose={() => setOpenTilesSettings(false)}
              onResetGameState={handleResetTilesGame}
            />
          )}

          {/* ========================================================================= */}
          {/* PRIMARY STICKY NAVIGATION: EXACT 9 SECTIONS                                */}
          {/* ========================================================================= */}
          <header className="sticky top-0 z-40 w-full border-b border-ivory-border bg-ivory/90 backdrop-blur-md transition-all duration-300">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-4 flex items-center justify-between">

              <a href="#home" className="group flex items-center gap-3.5">
                <div className="w-8 h-8 rounded-sm bg-white border border-ivory-border flex items-center justify-center font-editorial text-lg text-ink group-hover:border-emeraldAccent transition-colors">
                  D
                </div>
                <div>
                  <span className="font-mono-tag text-xs font-semibold tracking-widest text-ink block uppercase">
                    {data.meta.name}
                  </span>
                  <span className="font-mono-tag text-[9px] tracking-wider text-ink-dim uppercase block">
                    STUDENT · BUILDER · LEADER
                  </span>
                </div>
              </a>

              {/* Exact 9 Navigation Items */}
              <nav className="hidden xl:flex items-center space-x-5">
                {navItems.map((item) => (
                  <a
                    key={item.id}
                    href={item.href}
                    className={`font-mono-tag text-xs tracking-widest transition-all relative py-1 ${activeSection === item.id
                      ? "text-emeraldAccent font-semibold"
                      : "text-ink-muted hover:text-ink"
                      }`}
                  >
                    {item.label}
                    {activeSection === item.id && (
                      <span className="absolute bottom-0 left-0 w-full h-[2px] bg-emeraldAccent"></span>
                    )}
                  </a>
                ))}
              </nav>

              <div className="flex items-center gap-2.5">

                {/* View Resume Button */}
                <button
                  onClick={() => {
                    const resume = data.meta?.resumeUrl || "assets/resume/dakshana_sri_m_resume.pdf";
                    setLightboxImage({
                      src: resume,
                      alt: "Dakshana Sri M — Curriculum Vitae & Resume",
                      caption: "Dakshana Sri M · Data Science, Prototyping, Research & Leadership Resume"
                    });
                  }}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-mono-tag tracking-wider bg-white border border-ivory-border hover:border-emeraldAccent hover:text-emeraldAccent text-ink shadow-xs transition-all"
                  title="View Resume / Curriculum Vitae"
                >
                  <Icon name="eye" className="w-3.5 h-3.5 text-emeraldAccent" />
                  <span className="font-semibold">VIEW</span>
                </button>

                {editMode && (
                  <label className="cursor-pointer hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-mono-tag bg-ink text-white hover:bg-emeraldAccent shadow-xs transition-colors" title="Upload Resume PDF">
                    <Icon name="upload" className="w-3.5 h-3.5" />
                    <span>UPLOAD PDF</span>
                    <input
                      type="file"
                      accept=".pdf,image/*,.doc,.docx"
                      className="hidden"
                      onChange={(e) => handleFileUpload('meta.resumeUrl', e)}
                    />
                  </label>
                )}

                {/* Edit Mode Toggle */}
                <button
                  onClick={() => {
                    const next = !editMode;
                    setEditMode(next);
                    showToast(next ? "Edit Mode Enabled — Click text fields to customize" : "Public Mode Enabled", "info");
                  }}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-mono-tag tracking-wider border transition-all ${editMode
                    ? "bg-emeraldAccent text-white font-medium border-emeraldAccent shadow-md"
                    : "bg-white text-ink-muted border-ivory-border hover:border-emeraldAccent/40 hover:text-ink"
                    }`}
                  title="Toggle Edit Mode"
                >
                  <span className={`w-1.5 h-1.5 rounded-full ${editMode ? "bg-white animate-ping" : "bg-emeraldAccent"}`}></span>
                  <span>{editMode ? "EDITING ON" : "EDIT"}</span>
                </button>

                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="xl:hidden p-2 rounded bg-white border border-ivory-border text-ink hover:border-emeraldAccent"
                  aria-label="Toggle navigation menu"
                >
                  <Icon name={mobileMenuOpen ? "x" : "menu"} className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Compact Mobile Menu */}
            {mobileMenuOpen && (
              <div className="xl:hidden bg-white border-b border-ivory-border px-6 py-5 space-y-3">
                <div className="grid grid-cols-3 gap-2">
                  {navItems.map((item) => (
                    <a
                      key={item.label}
                      href={item.href}
                      onClick={() => setMobileMenuOpen(false)}
                      className="text-center py-2.5 px-2 font-mono-tag text-xs tracking-wider text-ink-muted hover:text-emeraldAccent hover:bg-ivory-muted rounded border border-ivory-border"
                    >
                      {item.label}
                    </a>
                  ))}
                </div>
              </div>
            )}
          </header>

          {/* Edit Mode Dock */}
          {editMode && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-white/95 border border-emeraldAccent/40 backdrop-blur-xl px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-4 text-xs font-mono-tag">
              <div className="flex items-center gap-2 pr-3 border-r border-ivory-border text-emeraldAccent font-semibold">
                <span className="w-2 h-2 rounded-full bg-emeraldAccent animate-ping"></span>
                <span>EDIT MODE LIVE</span>
              </div>
              <button
                onClick={() => setOpenTilesSettings(true)}
                className="text-emeraldAccent font-bold hover:underline flex items-center gap-1.5"
                title="Configure Tiles of Me Matching Game"
              >
                <Icon name="puzzle" className="w-3.5 h-3.5" />
                <span>TILES OF ME SETTINGS</span>
              </button>
              <button onClick={handleUndo} className="text-ink-muted hover:text-ink flex items-center gap-1 pl-2 border-l border-ivory-border">
                <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
                <span>UNDO</span>
              </button>
              <button onClick={handleExport} className="text-ink-muted hover:text-emeraldAccent flex items-center gap-1">
                <Icon name="download" className="w-3.5 h-3.5" />
                <span>EXPORT JSON</span>
              </button>
              <label className="text-ink-muted hover:text-emeraldAccent flex items-center gap-1 cursor-pointer">
                <Icon name="upload" className="w-3.5 h-3.5" />
                <span>IMPORT JSON</span>
                <input type="file" accept=".json" onChange={handleImport} className="hidden" />
              </label>
              <button onClick={handleReset} className="text-red-600/80 hover:text-red-600 flex items-center gap-1 pl-2 border-l border-ivory-border">
                <Icon name="trash-2" className="w-3.5 h-3.5" />
                <span>RESET</span>
              </button>
            </div>
          )}

          {/* ========================================================================= */}
          {/* 1. HOME                                                                   */}
          {/* ========================================================================= */}
          <motion.section
            id="home"
            className="relative min-h-[88vh] flex flex-col justify-center border-b border-ivory-border pt-8 pb-16 lg:py-20"
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.8, ease: "easeOut" }}
          >
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">

              <div className="flex flex-wrap items-center justify-between border-b border-ivory-border pb-4 mb-10 text-xs font-mono-tag text-ink-muted">
                <div className="flex items-center gap-3">
                  <span className="text-emeraldAccent font-semibold">DAKSHANA SRI M</span>
                  <span>/</span>
                  <span>BUILDER'S JOURNAL</span>
                  <span>/</span>
                  <span>TAMIL NADU, INDIA</span>
                </div>
                <div className="flex items-center gap-4 mt-2 sm:mt-0">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emeraldAccent animate-pulse"></span>
                    <span className="text-ink font-medium">STATUS: PROTOSEM W01 COMPLETED</span>
                  </div>
                  {renderSectionTile('tile_datascience_1')}
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-10 items-center">

                <div className="lg:col-span-7 space-y-7">

                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-sm bg-white border border-ivory-border text-xs font-mono-tag tracking-wider text-emeraldAccent font-medium shadow-sm">
                    <span className="w-1.5 h-1.5 rounded-full bg-emeraldAccent"></span>
                    <span>{data.meta.role}</span>
                  </div>

                  <div className="space-y-4">
                    <span className="font-mono-tag text-xs sm:text-sm font-semibold tracking-widest text-ink-muted block uppercase">
                      {data.meta.name}
                    </span>

                    <h1 className="font-editorial text-5xl sm:text-7xl lg:text-8xl tracking-tight text-ink leading-[0.95]">
                      {data.meta.headline}
                    </h1>

                    <motion.p
                      className="font-editorial italic text-2xl sm:text-3xl text-emeraldAccent leading-snug"
                      initial={{ opacity: 0, y: 20 }}
                      animate={{ opacity: 1, y: 0 }}
                      transition={{ duration: 0.8, delay: 0.3 }}
                    >
                      "{data.meta.tagline}"
                    </motion.p>

                    <p className="text-base sm:text-lg text-ink-muted max-w-xl font-light leading-relaxed">
                      {data.meta.subtagline}
                    </p>
                  </div>

                  {/* Quick Action Links */}
                  <div className="flex flex-wrap items-center gap-3.5 pt-2">
                    <a
                      href="#project"
                      className="group inline-flex items-center gap-2.5 px-5 py-3.5 bg-ink text-ivory font-mono-tag text-xs font-semibold tracking-wider uppercase rounded-sm hover:bg-emeraldAccent transition-all shadow-md"
                    >
                      <span>EXPLORE MY WORK</span>
                      <Icon name="arrow-down-right" className="w-4 h-4 group-hover:translate-x-0.5 group-hover:translate-y-0.5 transition-transform" />
                    </a>

                    <button
                      onClick={() => {
                        const resume = data.meta?.resumeUrl || "assets/resume/dakshana_sri_m_resume.pdf";
                        setLightboxImage({
                          src: resume,
                          alt: "Dakshana Sri M — Curriculum Vitae & Resume",
                          caption: "Dakshana Sri M · Data Science, Prototyping, Research & Leadership Resume"
                        });
                      }}
                      className="inline-flex items-center gap-2.5 px-5 py-3.5 bg-white border border-emeraldAccent/50 text-emeraldAccent font-mono-tag text-xs font-bold tracking-wider uppercase rounded-sm hover:bg-emeraldAccent hover:text-white transition-all shadow-sm"
                    >
                      <Icon name="file-text" className="w-4 h-4" />
                      <span>VIEW RESUME</span>
                    </button>

                    <a
                      href="#protosem"
                      className="inline-flex items-center gap-2.5 px-5 py-3.5 bg-white border border-ivory-border text-ink font-mono-tag text-xs font-medium tracking-wider uppercase rounded-sm hover:border-emeraldAccent hover:text-emeraldAccent transition-all shadow-sm"
                    >
                      <span>SEE PROTOSEM</span>
                      <Icon name="layers" className="w-4 h-4" />
                    </a>

                    <a
                      href="#contact"
                      className="inline-flex items-center gap-2.5 px-5 py-3.5 bg-emeraldAccent-dim border border-emeraldAccent/30 text-emeraldAccent font-mono-tag text-xs font-semibold tracking-wider uppercase rounded-sm hover:bg-emeraldAccent hover:text-white transition-all shadow-xs"
                    >
                      <span>LET'S CONNECT</span>
                      <Icon name="send" className="w-4 h-4" />
                    </a>
                  </div>

                  {/* Operational Status Matrix */}
                  <div className="pt-6 border-t border-ivory-border flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 flex-1">
                      {[
                        { label: "CURRENTLY", val: data.liveStatus.currently, field: "liveStatus.currently" },
                        { label: "LEARNING", val: data.liveStatus.learning, field: "liveStatus.learning" },
                        { label: "BUILDING", val: data.liveStatus.building, field: "liveStatus.building" },
                        { label: "PREPARING", val: data.liveStatus.preparing, field: "liveStatus.preparing" }
                      ].map((item, idx) => (
                        <div key={idx} className="p-3 bg-white border border-ivory-border rounded-sm shadow-xs">
                          <span className="font-mono-tag text-[9px] text-emeraldAccent block mb-1 uppercase tracking-wider font-semibold">
                            {item.label}
                          </span>
                          {editMode ? (
                            <input
                              type="text"
                              value={item.val}
                              onChange={(e) => updateField(item.field, e.target.value)}
                              className="bg-transparent border-b border-emeraldAccent text-xs text-ink w-full focus:outline-none"
                            />
                          ) : (
                            <p className="text-xs text-ink font-medium truncate" title={item.val}>{item.val}</p>
                          )}
                        </div>
                      ))}
                    </div>
                    {renderSectionTile('tile_student_1', 'self-end md:self-center')}
                  </div>

                </div>

                {/* Right Hero Image */}
                <div className="lg:col-span-5 relative">
                  <div className="relative mx-auto max-w-md lg:max-w-none">
                    <div className="absolute -top-3 -left-3 w-8 h-8 border-t-2 border-l-2 border-emeraldAccent z-10 pointer-events-none"></div>
                    <div className="absolute -bottom-3 -right-3 w-8 h-8 border-b-2 border-r-2 border-emeraldAccent z-10 pointer-events-none"></div>

                    <div className="relative overflow-hidden rounded-sm border border-ivory-border bg-white group aspect-[4/5] shadow-lg">
                      <img
                        src={data.meta.portrait}
                        alt={data.meta.avatarAlt}
                        className="w-full h-full object-cover grayscale contrast-110 brightness-100 group-hover:grayscale-0 group-hover:scale-[1.02] transition-all duration-700 ease-out"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-70"></div>

                      <div className="absolute bottom-4 left-4 right-4 p-4 bg-white/95 backdrop-blur-md border border-ivory-border rounded-sm shadow-md">
                        <div className="flex items-center justify-between text-xs font-mono-tag">
                          <div>
                            <span className="text-ink block font-bold">{data.meta.name}</span>
                            <span className="text-ink-muted text-[10px]">{data.meta.location}</span>
                          </div>
                          <span className="px-2 py-0.5 rounded bg-emeraldAccent-dim text-emeraldAccent text-[10px] border border-emeraldAccent/20 font-semibold">
                            BUILDER
                          </span>
                        </div>
                      </div>

                      {editMode && (
                        <div className="absolute top-4 right-4 z-20 flex flex-col gap-2">
                          <label className="cursor-pointer px-3 py-1.5 rounded bg-emeraldAccent text-white font-mono-tag text-xs font-bold shadow-md hover:bg-ink flex items-center gap-1.5 transition-colors">
                            <Icon name="image" className="w-3.5 h-3.5" />
                            <span>UPLOAD PHOTO</span>
                            <input
                              type="file"
